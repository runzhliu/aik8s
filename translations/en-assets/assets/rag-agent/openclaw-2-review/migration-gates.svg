<svg id="visual-qa-23" xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 2.0 Migration Gate and Risks</title>
  <desc id="desc">Migration process from backup, read-only inspection, copy environment repair, diff review, SQLite validation, plugin validation to canary and rollback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a24f3a"/></marker>
    <style>#visual-qa-23 .bg{fill:#fbfaf6}#visual-qa-23 .step{fill:#fff;stroke:#d8d0c4;stroke-width:2}#visual-qa-23 .risk{fill:#fff5ec;stroke:#d37855;stroke-width:2}#visual-qa-23 .gate{fill:#eef7f2;stroke:#4f8a6d;stroke-width:2}#visual-qa-23 .rollback{fill:#f3f0ff;stroke:#7457b7;stroke-width:2}#visual-qa-23 .title{font:700 38px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24211e}#visual-qa-23 .sub{font:400 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}#visual-qa-23 .h{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#302c28}#visual-qa-23 .body{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#514b45}#visual-qa-23 .small{font:400 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}#visual-qa-23 .n{font:700 18px Arial,sans-serif;fill:#fff}#visual-qa-23 .arrow{stroke:#a24f3a;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="930"/>
  <text class="title" x="70" y="65" data-translated-label="true">OpenClaw 2.0: Pass the Migration Gate First, Then Talk About In-Place Upgrade</text>
  <text class="sub" x="70" y="100" data-translated-label="true">Testing shows that doctor --fix modifies config structure, model routing, default concurrency, Skill state, and SQLite; do not try it directly in the production directory</text>

  <g>
    <rect class="step" x="65" y="155" rx="20" width="200" height="150"/><circle cx="95" cy="186" r="18" fill="#a24f3a"/><text class="n" x="90" y="192">1</text>
    <text class="h" x="125" y="193" data-translated-label="true" font-size="15.600000000000001" style="font-size: 15.6px;">Freeze &amp; backup</text><text class="body" x="90" y="230" data-translated-label="true" font-size="15.149988606152677" style="font-size: 15.15px;">Version, config, plugins</text><text class="body" x="90" y="255" data-translated-label="true" font-size="14.08542372881356" style="font-size: 14.0854px;">Backup SQLite / Session</text><text class="small" x="90" y="282" data-translated-label="true">Keep bootable 1.x</text>
    <path class="arrow" d="M265 230 L302 230"/>
    <rect class="step" x="305" y="155" rx="20" width="200" height="150"/><circle cx="335" cy="186" r="18" fill="#a24f3a"/><text class="n" x="330" y="192">2</text>
    <text class="h" x="365" y="193" data-translated-label="true" font-size="16.2004171580586" style="font-size: 16.2004px;">Read-only audit</text><text class="body" x="330" y="230">doctor --lint --json</text><text class="body" x="330" y="255">doctor --post-upgrade</text><text class="small" x="330" y="282" data-translated-label="true">Workspace abs. paths</text>
    <path class="arrow" d="M505 230 L542 230"/>
    <rect class="step" x="545" y="155" rx="20" width="200" height="150"/><circle cx="575" cy="186" r="18" fill="#a24f3a"/><text class="n" x="570" y="192">3</text>
    <text class="h" x="605" y="193" data-translated-label="true" font-size="18.529097121393686" style="font-size: 18.5291px;">Repair a copy</text><text class="body" x="570" y="230" data-translated-label="true" font-size="14" style="font-size: 14px;">Copy config + workspace</text><text class="body" x="570" y="255" data-translated-label="true">Copy only: doctor --fix</text><text class="small" x="570" y="282" data-translated-label="true">No prod. abs. paths</text>
    <path class="arrow" d="M745 230 L782 230"/>
    <rect class="step" x="785" y="155" rx="20" width="200" height="150"/><circle cx="815" cy="186" r="18" fill="#a24f3a"/><text class="n" x="810" y="192">4</text>
    <text class="h" x="845" y="193" data-translated-label="true">Diff Review</text><text class="body" x="810" y="230" data-translated-label="true">Diff openclaw.json</text><text class="body" x="810" y="255" data-translated-label="true" font-size="15.071757722968721" style="font-size: 15.0718px;">Check model/Skill edits</text><text class="small" x="810" y="282" data-translated-label="true">Audit removed keys too</text>
    <path class="arrow" d="M985 230 L1022 230"/>
    <rect class="step" x="1025" y="155" rx="20" width="200" height="150"/><circle cx="1055" cy="186" r="18" fill="#a24f3a"/><text class="n" x="1050" y="192">5</text>
    <text class="h" x="1085" y="193" data-translated-label="true" font-size="16.318254301300883" style="font-size: 16.3183px;">State Validation</text><text class="body" x="1050" y="230">session-sqlite dry-run</text><text class="body" x="1050" y="255">validate / inspect / backup</text><text class="small" x="1050" y="282" data-translated-label="true">Verify old + new sessions</text>
    <path class="arrow" d="M1225 230 L1262 230"/>
    <rect class="gate" x="1265" y="155" rx="20" width="270" height="150"/><circle cx="1295" cy="186" r="18" fill="#4f8a6d"/><text class="n" x="1290" y="192">6</text>
    <text class="h" x="1325" y="193">Canary Gate</text><text class="body" x="1290" y="230" data-translated-label="true" font-size="14.31516308097283" style="font-size: 14.3152px;">Plugins/channels/approvals/backup</text><text class="body" x="1290" y="255" data-translated-label="true">Sessions, Cron, model routing</text><text class="small" x="1290" y="282" data-translated-label="true">Only after all pass, expand traffic</text>
  </g>

  <text class="h" x="70" y="365" data-translated-label="true">High-risk areas exposed by testing</text>
  <rect class="risk" x="70" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="98" y="428" data-translated-label="true">Config is not "as-is compatible"</text>
  <text class="body" x="98" y="460" data-translated-label="true">agents.list → agents.entries; default marker removed</text>
  <text class="body" x="98" y="489" data-translated-label="true" font-size="14.124791463329508" style="font-size: 14.1248px;">doctor also writes defaults such as maxConcurrent=8, compaction</text>
  <text class="small" x="98" y="523" data-translated-label="true">Risk: capacity, behavior, and GitOps diff change simultaneously</text>

  <rect class="risk" x="568" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="596" y="428" data-translated-label="true" font-size="17.103977199119058" style="font-size: 17.104px;">Model routing: "same name, semantics may differ"</text>
  <text class="body" x="596" y="460">openai-codex/*、codex/* → openai/*</text>
  <text class="body" x="596" y="489" data-translated-label="true">Preserve intent via model-scoped agentRuntime.id=codex</text>
  <text class="small" x="596" y="523" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="596" y="523">Risk: model routing fails directly when plugin is not</tspan><tspan x="596" y="539.8">installed/authorized</tspan></text>

  <rect class="risk" x="1066" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="1094" y="428" data-translated-label="true">State migration is directional</text>
  <text class="body" x="1094" y="460" data-translated-label="true" font-size="14.905515100197572" style="font-size: 14.9055px;">Shared state and sessions further migrate into SQLite STRICT</text>
  <text class="body" x="1094" y="489" data-translated-label="true">New sessions may be unreadable by the old runtime</text>
  <text class="small" x="1094" y="523" data-translated-label="true">Risk: rolling back only the binary does not equal rolling back data</text>

  <rect class="risk" x="70" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="98" y="631" data-translated-label="true" font-size="18.241459443971934" style="font-size: 18.2415px;">doctor --fix write scope may exceed boundaries</text>
  <text class="body" x="98" y="663" data-translated-label="true">state-dir does not restrict absolute workspace paths</text>
  <text class="body" x="98" y="692" data-translated-label="true" font-size="14" style="font-size: 14px;">Workspace files such as TOOLS.md, AGENTS.md may be migrated</text>
  <text class="small" x="98" y="726" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="98" y="726">Risk: when replica configuration still points to production path, it</tspan><tspan x="98" y="742.8">may mistakenly modify production files</tspan></text>

  <rect class="risk" x="568" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="596" y="631" data-translated-label="true" font-size="17.34972221610864" style="font-size: 17.3497px;">Reorganization of plugin and Provider boundaries</text>
  <text class="body" x="596" y="663" data-translated-label="true">Official Provider split; capability consent is explicit</text>
  <text class="body" x="596" y="692" data-translated-label="true" font-size="14.641042417521486" style="font-size: 14.641px;">OpenProse and /prose removed; old SDK imports will be retired</text>
  <text class="small" x="596" y="726" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="596" y="726">Risk: plugin loadable ≠ feature available; need item-by-item</tspan><tspan x="596" y="742.8">regression</tspan></text>

  <rect class="risk" x="1066" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="1094" y="631" data-translated-label="true">Default behavior changes</text>
  <text class="body" x="1094" y="663" data-translated-label="true" font-size="14.202027699341132" style="font-size: 14.202px;">Session reset, memory/dreaming, concurrency, approvals change</text>
  <text class="body" x="1094" y="692" data-translated-label="true" font-size="14.030972273438458" style="font-size: 14.031px;">Skills with missing dependencies can be batch-disabled under --fix</text>
  <text class="small" x="1094" y="726" data-translated-label="true">Risk: upgrade succeeds but business behavior silently drifts</text>

  <rect class="rollback" x="70" y="810" rx="18" width="1460" height="75"/>
  <text class="h" x="98" y="841" data-translated-label="true">Rollback trigger conditions</text>
  <text class="body" x="275" y="841" data-translated-label="true">Missing sessions / model routing changes / plugin capability not approved / Cron duplicate or missed runs / Gateway connection failure / SQLite validation failure</text>
  <text class="small" x="98" y="868" data-translated-label="true">Rollback action must cover simultaneously: old binary + old configuration + pre-upgrade data snapshot; replacing only the npm package is prohibited</text>
</svg>
