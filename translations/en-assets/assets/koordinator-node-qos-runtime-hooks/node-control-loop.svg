<svg id="visual-qa-9" xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Koordlet node control loop</title>
  <desc id="desc">Closed loop from control plane NodeSLO to rule cache, runtime injection, kernel execution, and metric feedback</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71809a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26364f" flood-opacity="0.10"/></filter>
    <style>#visual-qa-9 text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}#visual-qa-9 .muted{fill:#65728b}#visual-qa-9 .white{fill:#fff}#visual-qa-9 .light{fill:#dce7ff}#visual-qa-9 .small{font-size:16px}#visual-qa-9 .body{font-size:18px}#visual-qa-9 .head{font-size:22px;font-weight:700}#visual-qa-9 .card{fill:#fff;stroke:#dbe2ef;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f7f9fd"/>
  <text x="60" y="66" font-size="34" font-weight="700" data-translated-label="true">How policies become real resource boundaries on nodes</text>
  <text x="60" y="102" class="muted" font-size="18" data-translated-label="true">Runtime Hook shortens the error window, Reconciler continuously corrects, and the kernel performs the actual execution</text>

  <g filter="url(#shadow)">
    <rect x="50" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="276" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="502" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="728" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="954" y="165" width="196" height="176" rx="18" class="card"/>
  </g>

  <circle cx="82" cy="199" r="18" fill="#e7efff"/><text x="82" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">1</text>
  <text x="108" y="207" class="head" data-translated-label="true" font-size="17.967817269719284" style="font-size: 17.9678px;">Control policy</text>
  <text x="72" y="249" class="body muted">SLO Config</text>
  <text x="72" y="278" class="body muted">koord-manager</text>
  <text x="72" y="307" class="body muted" data-translated-label="true" font-size="17.17132075471698" style="font-size: 17.1713px;">Generate NodeSLO</text>

  <circle cx="308" cy="199" r="18" fill="#eee9ff"/><text x="308" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#7555d9">2</text>
  <text x="334" y="207" class="head" data-translated-label="true">Rule cache</text>
  <text x="298" y="249" class="body muted" data-translated-label="true" font-size="16.648840769087176" style="font-size: 16.6488px;">Watch node objects</text>
  <text x="298" y="278" class="body muted" data-translated-label="true">Validate / compile</text>
  <text x="298" y="307" class="body muted" data-translated-label="true" font-size="14.84979020979021" style="font-size: 14.8498px;">Preserve desired state</text>

  <circle cx="534" cy="199" r="18" fill="#e6f8f3"/><text x="534" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#07876a">3</text>
  <text x="560" y="207" class="head" data-translated-label="true">Two paths</text>
  <text x="524" y="249" class="body muted" data-translated-label="true" font-size="14.18043405676127" style="font-size: 14.1804px;">Hook: inject at creation</text>
  <text x="524" y="278" class="body muted" data-translated-label="true" font-size="17.199467746601098" style="font-size: 17.1995px;">Reconcile / correct</text>
  <text x="524" y="307" class="body muted">Suppress / Evict</text>

  <circle cx="760" cy="199" r="18" fill="#fff0df"/><text x="760" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#d56a00">4</text>
  <text x="786" y="207" class="head" data-translated-label="true" font-size="21.03730067483129" style="font-size: 21.0373px;">Kernel layer</text>
  <text x="750" y="249" class="body muted">cgroup · resctrl</text>
  <text x="750" y="278" class="body muted" data-translated-label="true" font-size="16.103248171887696" style="font-size: 16.1032px;">Scheduling / reclaim</text>
  <text x="750" y="307" class="body muted">tc / eBPF</text>

  <circle cx="986" cy="199" r="18" fill="#ffe7ea"/><text x="986" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#d83c55">5</text>
  <text x="1012" y="207" class="head" data-translated-label="true">Feedback</text>
  <text x="976" y="249" class="body muted">NodeMetric · PSI</text>
  <text x="976" y="278" class="body muted" data-translated-label="true" font-size="15.622322648449815" style="font-size: 15.6223px;">Latency · OOM · I/O</text>
  <text x="976" y="307" class="body muted" data-translated-label="true" font-size="14.040000000000001" style="font-size: 14.04px;"><tspan x="976" y="307">Suppression and</tspan><tspan x="976" y="323.848">eviction</tspan></text>

  <path d="M246 253 H268" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M472 253 H494" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M698 253 H720" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M924 253 H946" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1050 341 V375 C1050 580 150 580 150 349" fill="none" stroke="#71809a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="414" width="470" height="124" rx="20" fill="#172e69"/>
    <rect x="638" y="414" width="470" height="124" rx="20" fill="#fff" stroke="#dbe2ef" stroke-width="1.5"/>
  </g>
  <text x="126" y="455" font-size="23" font-weight="700" class="white" data-translated-label="true">Lifecycle path: the earlier the better</text>
  <text x="126" y="488" font-size="14.040000000000001" class="light" data-translated-label="true" style="font-size: 14.04px;">Before the container's first process runs, write CPUSet, weight,</text>
  <text x="126" y="516" font-size="18" class="light" data-translated-label="true">memory/resctrl setup reduces startup races</text>

  <text x="672" y="455" font-size="18.789158345221114" font-weight="700" data-translated-label="true" style="font-size: 18.7892px;">Reconciliation loop: must eventually converge</text>
  <text x="672" y="488" font-size="17.33876476395948" class="muted" data-translated-label="true" style="font-size: 17.3388px;">Rule updates, container rebuilds, restarts, pressure</text>
  <text x="672" y="516" font-size="18" class="muted" data-translated-label="true">and drift caused by other components</text>

  <rect x="420" y="568" width="360" height="36" rx="18" fill="#eef2fa"/>
  <text x="600" y="592" text-anchor="middle" font-size="17" font-weight="600" fill="#586781" data-translated-label="true">Metrics drive the next policy cycle</text>
</svg>
