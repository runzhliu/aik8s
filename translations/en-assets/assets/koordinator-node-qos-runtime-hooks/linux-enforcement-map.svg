<svg id="visual-qa-8" xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Linux resource execution surface corresponding to Koordlet</title>
  <desc id="desc">CPU, memory, cache, block I/O, and network QoS each map to different kernel mechanisms</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71809a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26364f" flood-opacity="0.10"/></filter>
    <style>#visual-qa-8 text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}#visual-qa-8 .muted{fill:#65728b}#visual-qa-8 .inverse{fill:#fff}#visual-qa-8 .inverse-muted{fill:#dce7ff}#visual-qa-8 .h{font-size:22px;font-weight:700}#visual-qa-8 .b{font-size:16px}#visual-qa-8 .card{fill:#fff;stroke:#dbe2ef;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f7f9fd"/>
  <text x="60" y="64" font-size="34" font-weight="700" data-translated-label="true">A QoS policy ultimately maps to five execution surfaces</text>
  <text x="60" y="100" class="muted" font-size="17.336107217508914" data-translated-label="true" style="font-size: 17.3361px;">Koordlet is responsible for translation and coordination; resource boundaries are enforced jointly by the Linux kernel, hardware, and CNI</text>

  <rect x="194" y="130" width="812" height="70" rx="20" fill="#172e69"/>
  <text x="600" y="160" text-anchor="middle" font-size="22" font-weight="700" class="inverse" data-translated-label="true">Pod QoS · Annotations · NodeSLO · Node capabilities</text>
  <text x="600" y="187" text-anchor="middle" font-size="16" class="inverse-muted" data-translated-label="true">Runtime Hook injection at creation | Reconciler correction during runtime</text>
  <path d="M600 200 V236" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="250" width="206" height="260" rx="19" class="card"/>
    <rect x="271" y="250" width="206" height="260" rx="19" class="card"/>
    <rect x="497" y="250" width="206" height="260" rx="19" class="card"/>
    <rect x="723" y="250" width="206" height="260" rx="19" class="card"/>
    <rect x="949" y="250" width="206" height="260" rx="19" class="card"/>
  </g>

  <rect x="45" y="250" width="206" height="58" rx="19" fill="#eaf1ff"/><rect x="45" y="286" width="206" height="22" fill="#eaf1ff"/>
  <text x="148" y="286" text-anchor="middle" class="h" fill="#2563eb">CPU</text>
  <text x="67" y="344" class="b" font-weight="700" data-translated-label="true">cgroup + scheduler</text>
  <text x="67" y="378" class="b muted">weight / shares</text>
  <text x="67" y="405" class="b muted">quota / burst</text>
  <text x="67" y="432" class="b muted">CPUSet / NUMA</text>
  <text x="67" y="459" class="b muted">Core Scheduling</text>
  <text x="67" y="488" font-size="14" fill="#9a5c11" data-translated-label="true">Kernel/topology limits</text>

  <rect x="271" y="250" width="206" height="58" rx="19" fill="#eeeaff"/><rect x="271" y="286" width="206" height="22" fill="#eeeaff"/>
  <text x="374" y="286" text-anchor="middle" class="h" fill="#7555d9" data-translated-label="true">Memory</text>
  <text x="293" y="344" class="b" font-weight="700">memory cgroup</text>
  <text x="293" y="378" class="b muted" data-translated-label="true">min / low protection</text>
  <text x="293" y="405" class="b muted" data-translated-label="true">high: throttle / reclaim</text>
  <text x="293" y="432" class="b muted">max / OOM</text>
  <text x="293" y="459" class="b muted" data-translated-label="true" font-size="14.062170322795897" style="font-size: 14.0622px;">Reclamation and eviction</text>
  <text x="293" y="488" font-size="14" fill="#9a5c11" data-translated-label="true">Not compressible; guard</text>

  <rect x="497" y="250" width="206" height="58" rx="19" fill="#e6f8f3"/><rect x="497" y="286" width="206" height="22" fill="#e6f8f3"/>
  <text x="600" y="286" text-anchor="middle" class="h" fill="#07876a" data-translated-label="true" font-size="19.546301369863013" style="font-size: 19.5463px;">Cache / bandwidth</text>
  <text x="519" y="344" class="b" font-weight="700" data-translated-label="true" font-size="14.756355361050328" style="font-size: 14.7564px;">resctrl + CPU hardware</text>
  <text x="519" y="378" class="b muted">CAT：LLC ways</text>
  <text x="519" y="405" class="b muted" data-translated-label="true" font-size="14.12461126005362" style="font-size: 14.1246px;">MBA: memory bandwidth</text>
  <text x="519" y="432" class="b muted">CLOSID / tasks</text>
  <text x="519" y="459" class="b muted" data-translated-label="true">Cache hit feedback</text>
  <text x="519" y="488" font-size="14" fill="#9a5c11" data-translated-label="true">CPU / resctrl dependent</text>

  <rect x="723" y="250" width="206" height="58" rx="19" fill="#fff0df"/><rect x="723" y="286" width="206" height="22" fill="#fff0df"/>
  <text x="826" y="286" text-anchor="middle" class="h" fill="#d56a00" data-translated-label="true">Block I/O</text>
  <text x="745" y="344" class="b" font-weight="700">blkio / io cgroup</text>
  <text x="745" y="378" class="b muted" data-translated-label="true">weight relative share</text>
  <text x="745" y="405" class="b muted" data-translated-label="true" font-size="15.632022253129346" style="font-size: 15.632px;">IOPS / bandwidth limit</text>
  <text x="745" y="432" class="b muted" data-translated-label="true">Device major:minor</text>
  <text x="745" y="459" class="b muted" data-translated-label="true" font-size="14.649927007299269" style="font-size: 14.6499px;">Queue &amp; latency signals</text>
  <text x="745" y="488" font-size="14" fill="#9a5c11" data-translated-label="true">Resolve backing device</text>

  <rect x="949" y="250" width="206" height="58" rx="19" fill="#ffe8eb"/><rect x="949" y="286" width="206" height="22" fill="#ffe8eb"/>
  <text x="1052" y="286" text-anchor="middle" class="h" fill="#d83c55" data-translated-label="true">Network</text>
  <text x="971" y="344" class="b" font-weight="700">CNI + tc / eBPF</text>
  <text x="971" y="378" class="b muted" data-translated-label="true">Queue and priority</text>
  <text x="971" y="405" class="b muted" data-translated-label="true">Pod / node bandwidth</text>
  <text x="971" y="432" class="b muted" data-translated-label="true">Shaping and statistics</text>
  <text x="971" y="459" class="b muted" data-translated-label="true" font-size="14.166150743634988" style="font-size: 14.1662px;">Loss / retransmit signals</text>
  <text x="971" y="488" font-size="14" fill="#9a5c11" data-translated-label="true">Path sets capability</text>

  <rect x="92" y="560" width="1016" height="52" rx="18" fill="#edf1f8"/>
  <text x="600" y="592" text-anchor="middle" font-size="17.13057268722467" font-weight="600" fill="#56647d" data-translated-label="true" style="font-size: 17.1306px;">First verify node capability, then apply policy; ultimately prove effectiveness with actual kernel state and business SLO</text>
</svg>
