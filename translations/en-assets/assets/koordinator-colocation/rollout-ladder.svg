<svg id="visual-qa-7" xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Koordinator workload colocation five-stage rollout roadmap</title>
  <desc id="desc">Five-stage canary route from baseline establishment to continuous capacity engineering</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8190a9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#334155" flood-opacity="0.10"/></filter>
    <style>#visual-qa-7 text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}#visual-qa-7 .muted{fill:#6b7690}#visual-qa-7 .stage{font-size:17px;font-weight:700}#visual-qa-7 .h{font-size:23px;font-weight:700}#visual-qa-7 .b{font-size:17px}#visual-qa-7 .card{fill:#fff;stroke:#d9e0ec;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="675" fill="#f7f9fd"/>
  <text x="64" y="66" font-size="28.40263527173267" font-weight="700" data-translated-label="true" style="font-size: 28.4026px;">Workload colocation must be scaled up level by level, with each step able to exit</text>
  <text x="64" y="100" class="muted" font-size="18" data-translated-label="true">First prove online protection, then enable CPU reclamation; memory, multi-scheduler, and long-running tasks are validated later</text>

  <path d="M145 420 L1055 420" stroke="#bac4d5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="150" width="204" height="230" rx="18" class="card"/>
    <rect x="276" y="150" width="204" height="230" rx="18" class="card"/>
    <rect x="498" y="150" width="204" height="230" rx="18" class="card"/>
    <rect x="720" y="150" width="204" height="230" rx="18" class="card"/>
    <rect x="942" y="150" width="204" height="230" rx="18" class="card"/>
  </g>
  <g>
    <rect x="76" y="174" width="82" height="30" rx="15" fill="#e8f1ff"/><text x="117" y="195" text-anchor="middle" class="stage" fill="#1266e3" data-translated-label="true" font-size="15.414237288135594" style="font-size: 15.4142px;">Stage 0</text>
    <text x="76" y="244" class="h" data-translated-label="true" font-size="18.894189679659146" style="font-size: 18.8942px;">Establish baseline</text>
    <text x="76" y="280" class="b muted" data-translated-label="true" font-size="14.386396813785256" style="font-size: 14.3864px;">Cycles, peaks &amp; troughs</text><text x="76" y="308" class="b muted" data-translated-label="true">Online P99 / P999</text><text x="76" y="336" class="b muted" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="76" y="336">Node pressure and batch</tspan><tspan x="76" y="352.8">throughput</tspan></text>
  </g>
  <g>
    <rect x="298" y="174" width="82" height="30" rx="15" fill="#f0ebff"/><text x="339" y="195" text-anchor="middle" class="stage" fill="#7656d6" data-translated-label="true" font-size="16.252804204993428" style="font-size: 16.2528px;">Stage 1</text>
    <text x="298" y="244" class="h" data-translated-label="true" font-size="22.12351810790835" style="font-size: 22.1235px;">Only protection</text>
    <text x="298" y="280" class="b muted" data-translated-label="true" font-size="16.41281899109792" style="font-size: 16.4128px;">QoS and CPU/NUMA</text><text x="298" y="308" class="b muted">Memory QoS</text><text x="298" y="336" class="b muted" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="298" y="336">Reclamation not enabled</tspan><tspan x="298" y="352.8">yet</tspan></text>
  </g>
  <g>
    <rect x="520" y="174" width="82" height="30" rx="15" fill="#e7f8f2"/><text x="561" y="195" text-anchor="middle" class="stage" fill="#078a6c" data-translated-label="true" font-size="15.414237288135594" style="font-size: 15.4142px;">Stage 2</text>
    <text x="520" y="244" class="h" data-translated-label="true">CPU canary</text>
    <text x="520" y="280" class="b muted" data-translated-label="true" font-size="14.692109238814643" style="font-size: 14.6921px;">Short, idempotent, retry</text><text x="520" y="308" class="b muted" data-translated-label="true">Canary node pool</text><text x="520" y="336" class="b muted" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="520" y="336">Automatic exit on SLO</tspan><tspan x="520" y="352.8">violation</tspan></text>
  </g>
  <g>
    <rect x="742" y="174" width="82" height="30" rx="15" fill="#fff3e5"/><text x="783" y="195" text-anchor="middle" class="stage" fill="#d76b00" data-translated-label="true" font-size="15.414237288135594" style="font-size: 15.4142px;">Stage 3</text>
    <text x="742" y="244" class="h" data-translated-label="true" font-size="21.829075660893345" style="font-size: 21.8291px;">More resources</text>
    <text x="742" y="280" class="b muted" data-translated-label="true">Interference matrix</text><text x="742" y="308" class="b muted" data-translated-label="true" font-size="14.221102362204723" style="font-size: 14.2211px;">Memory / I/O / Network</text><text x="742" y="336" class="b muted" data-translated-label="true" font-size="14.246284610431424" style="font-size: 14.2463px;">Resource fulfillment rate</text>
  </g>
  <g>
    <rect x="964" y="174" width="82" height="30" rx="15" fill="#ffe9ed"/><text x="1005" y="195" text-anchor="middle" class="stage" fill="#c9435d" data-translated-label="true">4+</text>
    <text x="964" y="244" class="h" data-translated-label="true" font-size="19.411880674448767" style="font-size: 19.4119px;">Ongoing capacity</text>
    <text x="964" y="280" class="b muted" data-translated-label="true" font-size="14.168735190521932" style="font-size: 14.1687px;">Training / Spark / YARN</text><text x="964" y="308" class="b muted" data-translated-label="true" font-size="16.44942750929368" style="font-size: 16.4494px;">Ledger &amp; Checkpoint</text><text x="964" y="336" class="b muted" data-translated-label="true" font-size="14" style="font-size: 14px;"><tspan x="964" y="336">Periodic review and</tspan><tspan x="964" y="352.8">recalibration</tspan></text>
  </g>
  <g fill="#fff" stroke="#8190a9" stroke-width="3"><circle cx="156" cy="420" r="10"/><circle cx="378" cy="420" r="10"/><circle cx="600" cy="420" r="10"/><circle cx="822" cy="420" r="10"/><circle cx="1044" cy="420" r="10"/></g>

  <rect x="54" y="470" width="1092" height="136" rx="18" fill="#edf2fb" stroke="#cfd9ea"/>
  <text x="82" y="510" font-size="22" font-weight="700" fill="#314368" data-translated-label="true">Common release threshold for each level</text>
  <g class="b">
    <circle cx="90" cy="549" r="5" fill="#1266e3"/><text x="108" y="556" data-translated-label="true">No material SLO loss</text>
    <circle cx="330" cy="549" r="5" fill="#7656d6"/><text x="348" y="556" data-translated-label="true">Metrics &amp; ledger fresh</text>
    <circle cx="610" cy="549" r="5" fill="#078a6c"/><text x="628" y="556" data-translated-label="true">Throttle / evict / recover: tested</text>
    <circle cx="920" cy="549" r="5" fill="#d76b00"/><text x="938" y="556" data-translated-label="true">Net benefit is positive</text>
  </g>
  <text x="82" y="586" class="muted" font-size="17" data-translated-label="true">If any threshold fails: stop new borrowing → return resources → preserve evidence → adjust strategy and re-run the canary</text>
</svg>
