<text x="44" y="95" fill="#596b82" font-size="20.722206404774514" font-weight="400" text-anchor="start" data-max-width="1112" data-translated-label="true" style="font-size: 20.7222px;">Engineering analysis illustration · Total capacity, resource topology, and actual runnable quantity must be verified separately</text>
