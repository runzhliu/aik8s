<path d="M772 411 L802 411" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="514" width="1112" height="187" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="70" y="556" fill="#172b49" font-size="19.668421986864683" font-weight="650" text-anchor="start" data-max-width="1060" data-translated-label="true" style="font-size: 19.6684px;">Hypothetical example: two machines each have 4 idle GPUs, and a single Pod requires 8 GPUs on the same machine</text>
<text x="70" y="601" fill="#2455a6" font-size="23" font-weight="400" text-anchor="start" data-max-width="1060" data-translated-label="true">Total resources = 8 GPUs; number of physical nodes satisfying this Pod = 0.</text>
<text x="70" y="646" fill="#596b82" font-size="17.45465654685188" font-weight="400" text-anchor="start" data-max-width="1060" data-translated-label="true" style="font-size: 17.4547px;"><tspan x="70" y="646">Resource estimation or Provider admission should recognize this fragmentation and must not only expose the summed GPU count</tspan><tspan x="70" y="666.592">upward.</tspan></text>
<text x="44" y="735" fill="#596b82" font-size="18.24946166664371" font-weight="400" text-anchor="start" data-max-width="1112" data-translated-label="true" style="font-size: 18.2495px;">The execution constraints in the diagram are verification requirements and do not imply that all Providers use the same capacity model.</text>
