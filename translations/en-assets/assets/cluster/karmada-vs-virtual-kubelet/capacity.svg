<text x="599.0" y="400" fill="#087e82" font-size="22.421232227488147" font-weight="650" text-anchor="middle" data-max-width="308" data-translated-label="true" style="font-size: 22.4212px;">Provider / backend admission</text>
<text x="599.0" y="435" fill="#596b82" font-size="18.492088259225575" font-weight="400" text-anchor="middle" data-max-width="308" data-translated-label="true" style="font-size: 18.4921px;">Quota, capability, and available layout</text>
<rect x="814" y="361" width="340" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
