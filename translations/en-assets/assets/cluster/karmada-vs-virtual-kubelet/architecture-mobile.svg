<svg id="visual-qa-1" xmlns="http://www.w3.org/2000/svg" width="720" height="1390" viewBox="0 0 720 1390" role="img" aria-labelledby="title desc">
<title id="title">Karmada and Virtual Kubelet</title><desc id="desc">Architecture Diagram · Object Ownership and Execution Paths</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#687b93" stroke-width="1.5"/></marker></defs>
<rect width="720" height="1390" fill="#f6f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;,sans-serif">
<text x="44" y="55" fill="#172b49" font-size="32" font-weight="700" text-anchor="start" data-max-width="632" data-translated-label="true">Karmada and Virtual Kubelet</text>
<text x="44" y="95" fill="#596b82" font-size="23" font-weight="400" text-anchor="start" data-max-width="632" data-translated-label="true">Architecture Diagram · Object Ownership and Execution Paths</text>
<text x="44" y="158" fill="#2455a6" font-size="29" font-weight="700" text-anchor="start" data-max-width="632" data-translated-label="true">Karmada: Cross-Cluster Placement</text>
<rect x="44" y="185" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="224" fill="#2455a6" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584">Karmada API</text>
<text x="360" y="260" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Deployment Template: 6 Replicas</text>
<path d="M360 286 L360 305" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="312" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="351" fill="#2455a6" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">Policy / Binding / Work</text>
<text x="360" y="387" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Select Clusters and Distribute Resources</text>
<path d="M360 413 L360 432" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="439" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="478" fill="#2455a6" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">Member Deployment Controller</text>
<text x="360" y="514" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Create Pods in Each Member Cluster</text>
<path d="M360 540 L360 559" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="566" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="605" fill="#2455a6" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">Member Scheduler → Real Nodes</text>
<text x="360" y="641" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Example: A has 4 replicas, B has 2 replicas</text>
<text x="44" y="745" fill="#087e82" font-size="29" font-weight="700" text-anchor="start" data-max-width="632" data-translated-label="true">VK: External Compute Adaptation</text>
<rect x="44" y="772" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="811" fill="#087e82" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">Standard Kubernetes API</text>
<text x="360" y="847" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Deployment: 6 Replicas</text>
<path d="M360 873 L360 892" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="899" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="938" fill="#087e82" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">Local Controller / Scheduler</text>
<text x="360" y="974" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Create Pods, Select Virtual Nodes</text>
<path d="M360 1000 L360 1019" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="1026" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="1065" fill="#087e82" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584">VK / Provider</text>
<text x="360" y="1101" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Create Execution Instances Externally, Report Status</text>
<path d="M360 1127 L360 1146" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="1153" width="632" height="100" rx="12" fill="#fff" stroke="#d9e1ed"/>
<text x="360" y="1192" fill="#087e82" font-size="28" font-weight="650" text-anchor="middle" data-max-width="584" data-translated-label="true">External Execution Backend</text>
<text x="360" y="1228" fill="#596b82" font-size="25" font-weight="400" text-anchor="middle" data-max-width="584" data-translated-label="true">Features and Limitations Depend on the Provider</text>
<text x="44" y="1355" fill="#172b49" font-size="25" font-weight="400" text-anchor="start" data-max-width="632" data-translated-label="true">Can combine; define control and recovery ownership.</text>
</g></svg>
