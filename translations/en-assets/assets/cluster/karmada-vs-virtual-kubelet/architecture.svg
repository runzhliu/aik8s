<text x="890.0" y="725" fill="#087e82" font-size="24" font-weight="650" text-anchor="middle" data-max-width="448" data-translated-label="true">External execution backend</text>
<text x="890.0" y="760" fill="#596b82" font-size="20" font-weight="400" text-anchor="middle" data-max-width="448" data-translated-label="true">Container cloud / remote Kubernetes / others</text>
