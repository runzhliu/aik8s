<path d="M890 478 L890 517" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M890 624 L890 679" fill="none" stroke="#687b93" stroke-width="2" marker-end="url(#arrow)"/>
<text x="890" y="831" fill="#596b82" font-size="18.434687272197113" font-weight="400" text-anchor="middle" data-max-width="480" data-translated-label="true" style="font-size: 18.4347px;"><tspan x="890" y="831">Specific semantics depend on the Provider</tspan><tspan x="890" y="850.656">implementation</tspan></text>
<text x="44" y="910" fill="#172b49" font-size="19.46236102011599" font-weight="400" text-anchor="start" data-max-width="1112" data-translated-label="true" style="font-size: 19.4624px;"><tspan x="44" y="910">The two approaches can be combined; the party responsible for replicas, data, identity and failure recovery must be clearly</tspan><tspan x="44" y="931.528">defined.</tspan></text>
