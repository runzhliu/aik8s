<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Koordinator 控制闭环</title>
  <desc id="desc">工作负载契约、控制面、节点执行和可观测性形成闭环</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8190a9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#334155" flood-opacity="0.10"/></filter>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.muted{fill:#6b7690}.light{fill:#fff}.light-muted{fill:#dbe7ff}.h{font-size:23px;font-weight:700}.b{font-size:18px}.card{fill:#fff;stroke:#d9e0ec;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="675" fill="#f7f9fd"/>
  <text x="64" y="66" font-size="34" font-weight="700">Koordinator 把“预测、调度与保护”连成闭环</text>
  <text x="64" y="100" class="muted" font-size="18">控制面决定借多少、放哪里；节点侧持续校正，并在在线负载上涨时归还资源</text>

  <g filter="url(#shadow)"><rect x="448" y="247" width="304" height="170" rx="22" fill="#172e69"/></g>
  <text x="600" y="292" text-anchor="middle" font-size="26" font-weight="700" class="light">统一资源账本</text>
  <text x="600" y="327" text-anchor="middle" font-size="19" class="light-muted">NodeMetric · NodeSLO</text>
  <text x="600" y="358" text-anchor="middle" font-size="19" class="light-muted">Batch Resource · ElasticQuota</text>
  <rect x="502" y="379" width="196" height="24" rx="12" fill="#3159ad"/>
  <text x="600" y="397" text-anchor="middle" font-size="14" class="light">同一份容量，只记一次账</text>

  <g filter="url(#shadow)"><rect x="70" y="139" width="302" height="154" rx="20" class="card"/></g>
  <circle cx="112" cy="181" r="22" fill="#e8f1ff"/><text x="112" y="188" text-anchor="middle" font-size="21" font-weight="700" fill="#1266e3">1</text>
  <text x="150" y="188" class="h">工作负载契约</text>
  <text x="102" y="229" class="b muted">Priority · QoS · 配额 · Gang</text>
  <text x="102" y="258" class="b muted">重试、Checkpoint 与中断预算</text>

  <g filter="url(#shadow)"><rect x="70" y="401" width="302" height="154" rx="20" class="card"/></g>
  <circle cx="112" cy="443" r="22" fill="#f0ebff"/><text x="112" y="450" text-anchor="middle" font-size="21" font-weight="700" fill="#7656d6">2</text>
  <text x="150" y="450" class="h">控制面计算与放置</text>
  <text x="102" y="491" class="b muted">koord-manager 计算可借资源</text>
  <text x="102" y="520" class="b muted">scheduler 负载 / 拓扑感知调度</text>

  <g filter="url(#shadow)"><rect x="828" y="401" width="302" height="154" rx="20" class="card"/></g>
  <circle cx="870" cy="443" r="22" fill="#e7f8f2"/><text x="870" y="450" text-anchor="middle" font-size="21" font-weight="700" fill="#078a6c">3</text>
  <text x="908" y="450" class="h">节点执行与止损</text>
  <text x="860" y="491" class="b muted">koordlet / Runtime Hook</text>
  <text x="860" y="520" class="b muted">隔离、压制、驱逐、资源归还</text>

  <g filter="url(#shadow)"><rect x="828" y="139" width="302" height="154" rx="20" class="card"/></g>
  <circle cx="870" cy="181" r="22" fill="#fff3e5"/><text x="870" y="188" text-anchor="middle" font-size="21" font-weight="700" fill="#d76b00">4</text>
  <text x="908" y="188" class="h">反馈与收益核算</text>
  <text x="860" y="229" class="b muted">在线 P99 · PSI · OOM · Evict</text>
  <text x="860" y="258" class="b muted">批任务进度 · 兑现率 · 净收益</text>

  <path d="M372 215 C420 215 416 275 448 297" fill="none" stroke="#8190a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M372 475 C420 475 416 407 448 385" fill="none" stroke="#8190a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M752 385 C788 407 780 475 828 475" fill="none" stroke="#8190a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M828 215 C780 215 788 275 752 297" fill="none" stroke="#8190a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M979 401 L979 293" fill="none" stroke="#8190a9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M828 244 C790 244 787 238 787 214 C787 174 748 142 690 142 L418 142 C390 142 376 154 372 167" fill="none" stroke="#8190a9" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="600" y="626" text-anchor="middle" font-size="20" font-weight="600" fill="#526079">关键原则：指标过期就保守，在线 SLO 越界就归还，批任务必须可恢复</text>
</svg>
