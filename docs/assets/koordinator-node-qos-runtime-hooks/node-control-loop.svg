<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Koordlet 节点控制闭环</title>
  <desc id="desc">从控制面 NodeSLO 到规则缓存、运行时注入、内核执行和指标反馈的闭环</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71809a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26364f" flood-opacity="0.10"/></filter>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .muted{fill:#65728b}.white{fill:#fff}.light{fill:#dce7ff}.small{font-size:16px}.body{font-size:18px}.head{font-size:22px;font-weight:700}
      .card{fill:#fff;stroke:#dbe2ef;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#f7f9fd"/>
  <text x="60" y="66" font-size="34" font-weight="700">策略如何变成节点上的真实资源边界</text>
  <text x="60" y="102" class="muted" font-size="18">Runtime Hook 缩短错误窗口，Reconciler 持续纠偏，内核完成真正执行</text>

  <g filter="url(#shadow)">
    <rect x="50" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="276" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="502" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="728" y="165" width="196" height="176" rx="18" class="card"/>
    <rect x="954" y="165" width="196" height="176" rx="18" class="card"/>
  </g>

  <circle cx="82" cy="199" r="18" fill="#e7efff"/><text x="82" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#2563eb">1</text>
  <text x="108" y="207" class="head">控制面策略</text>
  <text x="72" y="249" class="body muted">SLO Config</text>
  <text x="72" y="278" class="body muted">koord-manager</text>
  <text x="72" y="307" class="body muted">生成 NodeSLO</text>

  <circle cx="308" cy="199" r="18" fill="#eee9ff"/><text x="308" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#7555d9">2</text>
  <text x="334" y="207" class="head">规则缓存</text>
  <text x="298" y="249" class="body muted">watch 节点对象</text>
  <text x="298" y="278" class="body muted">校验与编译规则</text>
  <text x="298" y="307" class="body muted">保留期望状态</text>

  <circle cx="534" cy="199" r="18" fill="#e6f8f3"/><text x="534" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#07876a">3</text>
  <text x="560" y="207" class="head">两条执行路径</text>
  <text x="524" y="249" class="body muted">Hook：创建时注入</text>
  <text x="524" y="278" class="body muted">Reconcile：持续纠偏</text>
  <text x="524" y="307" class="body muted">Suppress / Evict</text>

  <circle cx="760" cy="199" r="18" fill="#fff0df"/><text x="760" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#d56a00">4</text>
  <text x="786" y="207" class="head">内核执行面</text>
  <text x="750" y="249" class="body muted">cgroup · resctrl</text>
  <text x="750" y="278" class="body muted">调度与内存回收</text>
  <text x="750" y="307" class="body muted">tc / eBPF</text>

  <circle cx="986" cy="199" r="18" fill="#ffe7ea"/><text x="986" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#d83c55">5</text>
  <text x="1012" y="207" class="head">结果反馈</text>
  <text x="976" y="249" class="body muted">NodeMetric · PSI</text>
  <text x="976" y="278" class="body muted">延迟 · OOM · I/O</text>
  <text x="976" y="307" class="body muted">压制与驱逐</text>

  <path d="M246 253 H268" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M472 253 H494" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M698 253 H720" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M924 253 H946" stroke="#71809a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1050 341 V375 C1050 580 150 580 150 349" fill="none" stroke="#71809a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="414" width="470" height="124" rx="20" fill="#172e69"/>
    <rect x="638" y="414" width="470" height="124" rx="20" fill="#fff" stroke="#dbe2ef" stroke-width="1.5"/>
  </g>
  <text x="126" y="455" font-size="23" font-weight="700" class="white">生命周期路径：越早越好</text>
  <text x="126" y="488" font-size="18" class="light">在容器首个进程运行前写入 CPUSet、权重、</text>
  <text x="126" y="516" font-size="18" class="light">内存和 resctrl 参数，减少启动竞态</text>

  <text x="672" y="455" font-size="23" font-weight="700">协调循环：最终必须收敛</text>
  <text x="672" y="488" font-size="18" class="muted">应对规则更新、容器重建、组件重启、压力变化</text>
  <text x="672" y="516" font-size="18" class="muted">以及其他组件改写造成的配置漂移</text>

  <rect x="420" y="568" width="360" height="36" rx="18" fill="#eef2fa"/>
  <text x="600" y="592" text-anchor="middle" font-size="17" font-weight="600" fill="#586781">指标反馈让下一轮策略重新计算</text>
</svg>
