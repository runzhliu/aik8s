<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#71857c"/></marker></defs><text x="600" y="65" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263631">从零唤醒 HTTP 服务</text><text x="600" y="102" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#61756c">How an HTTP request wakes a zero-replica service</text><rect x="45" y="245" width="205" height="120" rx="9" fill="#f4f8f6" stroke="#adc8bc" stroke-width="1.5"/><text x="147.5" y="287" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#263631">请求到达</text><text x="147.5" y="317" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Request arrives</text><path d="M250 305 L276 305" fill="none" stroke="#71857c" stroke-width="2" marker-end="url(#arrow)"/><rect x="276" y="245" width="205" height="120" rx="9" fill="#f4f8f6" stroke="#adc8bc" stroke-width="1.5"/><text x="378.5" y="287" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#263631">入口接收</text><text x="378.5" y="317" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Entry receives</text><path d="M481 305 L507 305" fill="none" stroke="#71857c" stroke-width="2" marker-end="url(#arrow)"/><rect x="507" y="245" width="205" height="120" rx="9" fill="#f4f8f6" stroke="#adc8bc" stroke-width="1.5"/><text x="609.5" y="287" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#263631">触发扩容</text><text x="609.5" y="317" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Scaling starts</text><path d="M712 305 L738 305" fill="none" stroke="#71857c" stroke-width="2" marker-end="url(#arrow)"/><rect x="738" y="245" width="205" height="120" rx="9" fill="#f4f8f6" stroke="#adc8bc" stroke-width="1.5"/><text x="840.5" y="287" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#263631">启动并就绪</text><text x="840.5" y="317" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Pod becomes ready</text><path d="M943 305 L969 305" fill="none" stroke="#71857c" stroke-width="2" marker-end="url(#arrow)"/><rect x="969" y="245" width="205" height="120" rx="9" fill="#f4f8f6" stroke="#adc8bc" stroke-width="1.5"/><text x="1071.5" y="287" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#263631">返回结果</text><text x="1071.5" y="317" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Response returned</text><text x="600" y="443" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#587068">排队、调度、拉镜像与初始化都会影响等待时间</text><text x="600" y="478" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Queueing, scheduling, image pull and initialization add to the wait.</text><text x="600" y="556" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#587068">入口缓冲和客户端超时均有限</text><text x="600" y="591" font-family="Hiragino Sans GB, PingFang SC, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#587068">Buffer capacity and client timeouts are finite.</text></svg>