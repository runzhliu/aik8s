<line x1="56" y1="579" x2="1144" y2="579" stroke="#d8e1db" stroke-width="2"/>
<text x="55" y="638" font-size="33" fill="#28735b" text-anchor="start">每格是 1 个旧 Pod，叉号表示该 Pod 收到了驱逐事件。</text>
