<text x="888" y="429" font-size="35" fill="#28735b" text-anchor="start">启动</text>
<text x="58" y="529" font-size="34" fill="#202724" text-anchor="start">禁止整组驱逐</text>
<rect x="489" y="498" width="40" height="40" rx="5" fill="#77847f" stroke="#77847f" stroke-width="2"/>
