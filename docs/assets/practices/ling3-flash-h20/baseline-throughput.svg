<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Ling-3.0-flash BF16 基线吞吐</title>
  <desc id="desc">单台四卡 H20 上 SGLang 与 vLLM 的在线负载和长上下文输出吞吐中位数。</desc>
  <style>
    .title{font:700 38px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .sub{font:400 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
    .axis{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
    .value{font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .legend{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .panel{font:700 24px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .note{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
  </style>
  <rect width="1500" height="1040" fill="#fbfcfe"/>
  <text class="title" x="72" y="66">基线：常规负载偏 SGLang，超长上下文转向 vLLM</text>
  <text class="sub" x="72" y="103">Ling-3.0-flash · BF16 · 单节点 4×H20 141GB · TP4 · Speculative Off · 每轮清 Prefix Cache</text>
  <rect x="1060" y="108" width="24" height="24" rx="5" fill="#2563eb"/>
  <text class="legend" x="1096" y="126">SGLang</text>
  <rect x="1245" y="108" width="24" height="24" rx="5" fill="#e4572e"/>
  <text class="legend" x="1281" y="126">vLLM</text>
  <text class="panel" x="72" y="175">常规在线负载（输出 token/s）</text>
  <line x1="118" y1="545.0" x2="1420" y2="545.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="551.0" text-anchor="end">0</text>
  <line x1="118" y1="490.0" x2="1420" y2="490.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="496.0" text-anchor="end">300</text>
  <line x1="118" y1="435.0" x2="1420" y2="435.0" stroke="#dfe5ee"/>
