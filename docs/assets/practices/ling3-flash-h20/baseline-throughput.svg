  <text class="axis" x="102" y="276.0" text-anchor="end">1500</text>
  <line x1="118" y1="215.0" x2="1420" y2="215.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="221.0" text-anchor="end">1800</text>
  <rect x="201.8" y="257.8" width="72.0" height="287.2" rx="7" fill="#2563eb"/>
