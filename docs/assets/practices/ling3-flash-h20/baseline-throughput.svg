  <text class="value" x="323.8" y="709.5" text-anchor="middle">76.3</text>
  <text class="axis" x="280.8" y="925" text-anchor="middle">32K</text>
  <rect x="527.2" y="757.8" width="72.0" height="137.2" rx="7" fill="#2563eb"/>
  <text class="value" x="563.2" y="747.8" text-anchor="middle">59.6</text>
  <rect x="613.2" y="774.3" width="72.0" height="120.7" rx="7" fill="#e4572e"/>
  <text class="value" x="649.2" y="764.3" text-anchor="middle">52.5</text>
  <text class="axis" x="606.2" y="925" text-anchor="middle">64K</text>
  <rect x="852.8" y="707.6" width="72.0" height="187.4" rx="7" fill="#2563eb"/>
  <text class="value" x="888.8" y="697.6" text-anchor="middle">81.5</text>
  <rect x="938.8" y="688.4" width="72.0" height="206.6" rx="7" fill="#e4572e"/>
  <text class="value" x="974.8" y="678.4" text-anchor="middle">89.8</text>
  <text class="axis" x="931.8" y="925" text-anchor="middle">128K</text>
  <rect x="1178.2" y="779.1" width="72.0" height="115.9" rx="7" fill="#2563eb"/>
  <text class="value" x="1214.2" y="769.1" text-anchor="middle">50.4</text>
  <rect x="1264.2" y="764.6" width="72.0" height="130.4" rx="7" fill="#e4572e"/>
  <text class="value" x="1300.2" y="754.6" text-anchor="middle">56.7</text>
  <text class="axis" x="1257.2" y="925" text-anchor="middle">256K</text>
  <rect x="72" y="958" width="1356" height="52" rx="12" fill="#eef3f9"/>
  <text class="note" x="750" y="980" text-anchor="middle">上图与下图使用独立纵轴；同一客户端、Checkpoint、GPU、TP、Context、请求集合与三轮中位数</text>
  <text class="note" x="750" y="1002" text-anchor="middle">256K 为单次能力探针；其余 Case 每轮前调用服务端缓存重置接口</text>
</svg>
