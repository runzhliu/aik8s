<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">共享前缀与随机输入对比</title>
  <desc id="desc">四组请求共享约 4K token 系统提示词后，缓存命中率为 50.2%，输入和输出吞吐提高，TTFT 与端到端延迟降低。</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="64" y="42" fill="#0f172a" font-family="sans-serif" font-size="24" font-weight="700">共享 4K 系统提示词：Radix Cache 的收益能测出来</text>
  <text x="64" y="74" fill="#64748b" font-family="sans-serif" font-size="14">并发 8 · 32 请求 · 4 个前缀组 · 服务端缓存命中率 50.2%</text>

  <g fill="#e2e8f0">
    <rect x="250" y="112" width="500" height="42" rx="7"/><rect x="250" y="202" width="500" height="42" rx="7"/>
    <rect x="250" y="292" width="500" height="42" rx="7"/><rect x="250" y="382" width="500" height="42" rx="7"/>
  </g>
  <g fill="#2563eb">
    <rect x="250" y="112" width="332" height="42" rx="7"/><rect x="250" y="202" width="276" height="42" rx="7"/>
  </g>
  <g fill="#10b981">
    <rect x="250" y="292" width="262" height="42" rx="7"/><rect x="250" y="382" width="204" height="42" rx="7"/>
  </g>

  <g fill="#475569" font-family="sans-serif" font-size="15">
    <text x="65" y="138">Input tok/s</text><text x="65" y="228">Output tok/s</text>
    <text x="65" y="318">P95 TTFT</text><text x="65" y="408">P95 E2E</text>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="14">
    <text x="598" y="138">12.17K → 20.24K（+66.3%）</text>
    <text x="542" y="228">184.46 → 286.31（+55.2%）</text>
    <text x="528" y="318">2.28s → 1.09s（-52.4%）</text>
    <text x="470" y="408">3.06s → 1.82s（-40.7%）</text>
  </g>
  <g font-family="sans-serif" font-size="13">
    <rect x="250" y="464" width="18" height="18" rx="3" fill="#2563eb"/><text x="278" y="478" fill="#475569">吞吐提升</text>
    <rect x="372" y="464" width="18" height="18" rx="3" fill="#10b981"/><text x="400" y="478" fill="#475569">延迟下降</text>
    <text x="510" y="478" fill="#64748b">条形长度表示相对改善幅度，灰色轨道为 100%</text>
  </g>
</svg>
