<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">共享前缀与随机输入对比</title>
  <desc id="desc">四组请求共享约 4K token 系统提示词后，缓存命中率为 50.2%，输入吞吐提高，TTFT 与端到端延迟降低。</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="64" y="42" fill="#0f172a" font-family="sans-serif" font-size="24" font-weight="700">共享 4K 系统提示词：Radix Cache 的收益能测出来</text>
  <text x="64" y="70" fill="#64748b" font-family="sans-serif" font-size="14">并发 8 · 32 请求 · 4 个前缀组 · 服务端缓存命中率 50.2%</text>
  <g fill="#64748b" font-family="sans-serif" font-size="15">
    <text x="65" y="145">Input tok/s</text><text x="65" y="235">Output tok/s</text>
    <text x="65" y="325">P95 TTFT</text><text x="65" y="415">P95 E2E</text>
  </g>
  <g fill="#cbd5e1">
    <rect x="210" y="112" width="300" height="42" rx="7"/><rect x="210" y="202" width="300" height="42" rx="7"/>
    <rect x="210" y="292" width="300" height="42" rx="7"/><rect x="210" y="382" width="300" height="42" rx="7"/>
  </g>
  <g fill="#2563eb">
    <rect x="210" y="112" width="499" height="42" rx="7"/><rect x="210" y="202" width="466" height="42" rx="7"/>
  </g>
  <g fill="#10b981">
    <rect x="210" y="292" width="143" height="42" rx="7"/><rect x="210" y="382" width="178" height="42" rx="7"/>
  </g>
  <g fill="#0f172a" font-family="sans-serif" font-size="14">
    <text x="725" y="139">+66.3%</text><text x="692" y="229">+55.2%</text>
    <text x="369" y="319">-52.4%</text><text x="404" y="409">-40.7%</text>
  </g>
  <g font-family="sans-serif" font-size="13">
    <rect x="596" y="466" width="18" height="18" rx="3" fill="#cbd5e1"/><text x="622" y="480" fill="#475569">随机独立输入（基线）</text>
    <rect x="760" y="466" width="18" height="18" rx="3" fill="#2563eb"/><text x="786" y="480" fill="#475569">共享前缀</text>
  </g>
</svg>
