<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Hy4-preview BF16 长上下文 P50 TTFT</title>
  <desc id="desc">两台八卡 H20 上关闭前缀缓存后的 32K、64K 和 130K 单并发首 token 延迟中位数。</desc>
  <style>
    .title{font:700 38px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .sub{font:400 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
    .axis{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
    .value{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .legend{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
    .note{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#596579}
  </style>
  <rect width="1500" height="860" fill="#fbfcfe"/>
  <text class="title" x="72" y="68">长上下文：64K 起 vLLM 的 TTFT 反超</text>
  <text class="sub" x="72" y="104">Hy4-preview BF16 · 2×8 H20 · C1 · Prefix Cache Off · 两轮中位数</text>
  <rect x="1060" y="110" width="24" height="24" rx="5" fill="#2563eb"/>
  <text class="legend" x="1096" y="128">SGLang · TP16</text>
  <rect x="1265" y="110" width="24" height="24" rx="5" fill="#e4572e"/>
  <text class="legend" x="1301" y="128">vLLM · TP8×PP2</text>
  <line x1="118" y1="690.0" x2="1420" y2="690.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="696.0" text-anchor="end">0</text>
  <line x1="118" y1="588.0" x2="1420" y2="588.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="594.0" text-anchor="end">10</text>
  <line x1="118" y1="486.0" x2="1420" y2="486.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="492.0" text-anchor="end">20</text>
  <line x1="118" y1="384.0" x2="1420" y2="384.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="390.0" text-anchor="end">30</text>
  <line x1="118" y1="282.0" x2="1420" y2="282.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="288.0" text-anchor="end">40</text>
  <line x1="118" y1="180.0" x2="1420" y2="180.0" stroke="#dfe5ee"/>
  <text class="axis" x="102" y="186.0" text-anchor="end">50</text>
  <rect x="189.0" y="589.6" width="132" height="100.4" rx="8" fill="#2563eb"/>
  <text class="value" x="255.0" y="577.6" text-anchor="middle">9.84s</text>
  <rect x="349.0" y="575.5" width="132" height="114.5" rx="8" fill="#e4572e"/>
  <text class="value" x="415.0" y="563.5" text-anchor="middle">11.22s</text>
  <text class="axis" x="335.0" y="728" text-anchor="middle">32K / 128</text>
  <rect x="623.0" y="480.0" width="132" height="210.0" rx="8" fill="#2563eb"/>
  <text class="value" x="689.0" y="468.0" text-anchor="middle">20.59s</text>
  <rect x="783.0" y="492.0" width="132" height="198.0" rx="8" fill="#e4572e"/>
  <text class="value" x="849.0" y="480.0" text-anchor="middle">19.41s</text>
  <text class="axis" x="769.0" y="728" text-anchor="middle">64K / 128</text>
  <rect x="1057.0" y="239.6" width="132" height="450.4" rx="8" fill="#2563eb"/>
  <text class="value" x="1123.0" y="227.6" text-anchor="middle">44.15s</text>
  <rect x="1217.0" y="317.0" width="132" height="373.0" rx="8" fill="#e4572e"/>
  <text class="value" x="1283.0" y="305.0" text-anchor="middle">36.57s</text>
  <text class="axis" x="1203.0" y="728" text-anchor="middle">130K / 1K</text>
  <text class="axis" x="38" y="445" transform="rotate(-90 38 445)" text-anchor="middle">P50 TTFT（秒，越低越好）</text>
  <rect x="72" y="786" width="1356" height="52" rx="12" fill="#eef3f9"/>
  <text class="note" x="750" y="808" text-anchor="middle">SGLang 使用 disable-radix-cache；vLLM 使用 no-enable-prefix-caching</text>
  <text class="note" x="750" y="830" text-anchor="middle">130K Case 为 130,000 输入 / 1,024 输出；其余为 128 输出</text>
</svg>
