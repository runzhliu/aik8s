<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Helvetica Neue, Hiragino Sans GB, sans-serif" font-weight="400">
<rect width="1200" height="675" fill="white"/>
<text x="68" y="74" text-anchor="start" font-size="42" fill="#24322c">恢复桌面草稿的两条路径</text>
<text x="68" y="134" text-anchor="start" font-size="28" fill="#506057">起点：草稿在来宾内存中，尚无报告文件</text>
<path d="M68 175 L1132 175" fill="none" stroke="#bfc9c3" stroke-width="2"/>
<text x="70" y="253" text-anchor="start" font-size="36" fill="#69736d">原沙箱 ID</text>
<path d="M78 328 L78 537" fill="none" stroke="#69736d" stroke-width="2"/>
<circle cx="78" cy="328" r="7" fill="#69736d"/>
<text x="101" y="337" text-anchor="start" font-size="25" fill="#24322c">暂停后请求恢复</text>
<circle cx="78" cy="432" r="7" fill="#69736d"/>
<text x="101" y="441" text-anchor="start" font-size="25" fill="#24322c">来宾已恢复，代理缓存清除报错</text>
<circle cx="78" cy="536" r="7" fill="#69736d"/>
<text x="101" y="545" text-anchor="start" font-size="25" fill="#24322c">短时重试仍无法打开原入口</text>
<text x="636" y="253" text-anchor="start" font-size="36" fill="#49785f">新沙箱 ID</text>
<path d="M644 328 L644 537" fill="none" stroke="#49785f" stroke-width="2"/>
<circle cx="644" cy="328" r="7" fill="#49785f"/>
<text x="667" y="337" text-anchor="start" font-size="25" fill="#24322c">从暂停前的完整快照创建实例</text>
<circle cx="644" cy="432" r="7" fill="#49785f"/>
<text x="667" y="441" text-anchor="start" font-size="25" fill="#24322c">用新入口连接，读到未保存的草稿</text>
<circle cx="644" cy="536" r="7" fill="#49785f"/>
<text x="667" y="545" text-anchor="start" font-size="25" fill="#24322c">审批、保存并读回报告文件</text>
</svg>
