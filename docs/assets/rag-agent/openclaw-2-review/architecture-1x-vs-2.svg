<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 1.x 与 2.0 架构演进对比</title>
  <desc id="desc">OpenClaw 从 Gateway 中心的个人运行时，演进为带持久会话、权限、工作板、设备和云工作器的协调平面。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a5a4a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6d4c41" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#fbfaf6}.panel{fill:#fff;stroke:#ded8cc;stroke-width:2}.box{fill:#fffdf8;stroke:#cfc7b8;stroke-width:2}
      .core{fill:#fff0eb;stroke:#c45b42;stroke-width:3}.new{fill:#f3f0ff;stroke:#7457b7;stroke-width:2}
      .state{fill:#eef7f2;stroke:#4f8a6d;stroke-width:2}.warn{fill:#fff7d9;stroke:#b8860b;stroke-width:2}
      .title{font:700 38px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24211e}
      .subtitle{font:400 21px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}
      .h2{font:700 27px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2825}
      .h3{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2b2825}
      .body{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#514b45}
      .small{font:400 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}
      .tag{font:700 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .arrow{stroke:#8a5a4a;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="940"/>
  <text class="title" x="80" y="70">OpenClaw 1.x → 2.0：从个人 Gateway 到协调平面</text>
  <text class="subtitle" x="80" y="108">基于 2026.7.1 与 2026.8.1 的安装、Control UI、Gateway、Workboard 和迁移实测</text>

  <rect class="panel" x="60" y="150" rx="28" width="700" height="690" filter="url(#shadow)"/>
  <rect class="panel" x="840" y="150" rx="28" width="700" height="690" filter="url(#shadow)"/>
  <rect x="90" y="176" rx="14" width="92" height="32" fill="#7d7268"/><text class="tag" x="111" y="198">1.x</text>
  <text class="h2" x="200" y="202">Gateway 中心的个人 Agent Runtime</text>
  <rect x="870" y="176" rx="14" width="112" height="32" fill="#c45b42"/><text class="tag" x="891" y="198">2.0</text>
  <text class="h2" x="1000" y="202">Gateway 之上的可扩展协调平面</text>

  <rect class="box" x="120" y="250" rx="18" width="580" height="74"/>
  <text class="h3" x="156" y="281">入口</text><text class="body" x="248" y="281">Control UI · CLI · 消息渠道</text>
  <text class="small" x="156" y="307">会话和路由最终汇入一个常驻 Gateway</text>
  <path class="arrow" d="M410 324 L410 370"/>
  <rect class="core" x="150" y="375" rx="22" width="520" height="132"/>
  <text class="h3" x="184" y="414">OpenClaw Gateway</text>
  <text class="body" x="184" y="445">Channel · Session · Agent Loop · Model · Tools</text>
  <text class="small" x="184" y="475">单机状态与可信操作者边界是默认假设</text>
  <path class="arrow" d="M410 507 L410 552"/>
  <rect class="state" x="110" y="557" rx="18" width="250" height="112"/>
  <text class="h3" x="140" y="593">本地状态</text>
  <text class="body" x="140" y="622">JSON / SQLite</text>
  <text class="small" x="140" y="648">Session · Cron · Memory</text>
  <rect class="box" x="460" y="557" rx="18" width="250" height="112"/>
  <text class="h3" x="490" y="593">运行能力</text>
  <text class="body" x="490" y="622">Skill · Plugin · Tool</text>
  <text class="small" x="490" y="648">本机或已配对 Node</text>
  <rect class="warn" x="110" y="707" rx="18" width="600" height="92"/>
  <text class="h3" x="140" y="742">结构优势：简单、直连、PoC 快</text>
  <text class="body" x="140" y="773">结构短板：设备、权限、任务状态与团队协作仍分散</text>

  <rect class="box" x="900" y="244" rx="18" width="580" height="84"/>
  <text class="h3" x="930" y="277">多端入口与外部事件</text>
  <text class="body" x="930" y="305">Web · CLI · iOS/Android · Watch · Desktop · Channels</text>
  <path class="arrow" d="M1190 328 L1190 365"/>
  <rect class="core" x="930" y="370" rx="22" width="520" height="118"/>
  <text class="h3" x="964" y="408">Gateway Coordination Plane</text>
  <text class="body" x="964" y="438">会话、路由、模型、工具、事件与审批统一协调</text>
  <text class="small" x="964" y="466">仍是 OpenClaw Gateway，不等于强多租户控制面</text>

  <path class="arrow" d="M1030 488 L1030 530"/>
  <path class="arrow" d="M1190 488 L1190 530"/>
  <path class="arrow" d="M1350 488 L1350 530"/>
  <rect class="state" x="875" y="535" rx="18" width="300" height="120"/>
  <text class="h3" x="905" y="571">持久会话与共享状态</text>
  <text class="body" x="905" y="601">SQLite · Progress Cards</text>
  <text class="small" x="905" y="629">Conversation Search · Backup</text>
  <rect class="new" x="1205" y="535" rx="18" width="300" height="120"/>
  <text class="h3" x="1235" y="571">权限与安全操作面</text>
  <text class="body" x="1235" y="601">Permission · Secrets</text>
  <text class="small" x="1235" y="629">Approvals · Command Owner</text>

  <rect class="new" x="875" y="680" rx="18" width="300" height="120"/>
  <text class="h3" x="905" y="716">任务与协作</text>
  <text class="body" x="905" y="746">Workboard · Automations</text>
  <text class="small" x="905" y="774">Questions · Branches · Shared Session</text>
  <rect class="box" x="1205" y="680" rx="18" width="300" height="120"/>
  <text class="h3" x="1235" y="716">运行位置扩展</text>
  <text class="body" x="1235" y="746">Paired Device · Cloud Worker</text>
  <text class="small" x="1235" y="774">Fleet / Swarm（实验性）</text>

  <rect x="60" y="868" rx="18" width="1480" height="48" fill="#2d2925"/>
  <text x="800" y="899" text-anchor="middle" style="font:700 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">
    本质变化：OpenClaw 自己变得更像“Agent 操作系统”，但安全隔离与组织级多租户仍需独立判断
  </text>
</svg>
