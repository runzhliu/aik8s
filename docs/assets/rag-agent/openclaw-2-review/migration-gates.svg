<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 2.0 迁移 Gate 与风险</title>
  <desc id="desc">从备份、只读检查、复制环境修复、差异审阅、SQLite 验证、插件验证到灰度和回滚的迁移流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a24f3a"/></marker>
    <style>
      .bg{fill:#fbfaf6}.step{fill:#fff;stroke:#d8d0c4;stroke-width:2}.risk{fill:#fff5ec;stroke:#d37855;stroke-width:2}
      .gate{fill:#eef7f2;stroke:#4f8a6d;stroke-width:2}.rollback{fill:#f3f0ff;stroke:#7457b7;stroke-width:2}
      .title{font:700 38px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24211e}
      .sub{font:400 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}
      .h{font:700 20px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#302c28}
      .body{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#514b45}
      .small{font:400 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#6f675f}
      .n{font:700 18px Arial,sans-serif;fill:#fff}.arrow{stroke:#a24f3a;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="930"/>
  <text class="title" x="70" y="65">OpenClaw 2.0：先过迁移 Gate，再谈原地升级</text>
  <text class="sub" x="70" y="100">实测表明 doctor --fix 会改配置结构、模型路由、默认并发、Skill 状态和 SQLite；不要在生产目录直接试</text>

  <g>
    <rect class="step" x="65" y="155" rx="20" width="200" height="150"/><circle cx="95" cy="186" r="18" fill="#a24f3a"/><text class="n" x="90" y="192">1</text>
    <text class="h" x="125" y="193">冻结与备份</text><text class="body" x="90" y="230">记录版本、配置、插件</text><text class="body" x="90" y="255">备份 SQLite / Session</text><text class="small" x="90" y="282">保留可启动的 1.x 二进制</text>
    <path class="arrow" d="M265 230 L302 230"/>
    <rect class="step" x="305" y="155" rx="20" width="200" height="150"/><circle cx="335" cy="186" r="18" fill="#a24f3a"/><text class="n" x="330" y="192">2</text>
    <text class="h" x="365" y="193">只读盘点</text><text class="body" x="330" y="230">doctor --lint --json</text><text class="body" x="330" y="255">doctor --post-upgrade</text><text class="small" x="330" y="282">列出 workspace 绝对路径</text>
    <path class="arrow" d="M505 230 L542 230"/>
    <rect class="step" x="545" y="155" rx="20" width="200" height="150"/><circle cx="575" cy="186" r="18" fill="#a24f3a"/><text class="n" x="570" y="192">3</text>
    <text class="h" x="605" y="193">复制环境修复</text><text class="body" x="570" y="230">复制 config + workspace</text><text class="body" x="570" y="255">doctor --fix 只跑副本</text><text class="small" x="570" y="282">禁止复用生产绝对路径</text>
    <path class="arrow" d="M745 230 L782 230"/>
    <rect class="step" x="785" y="155" rx="20" width="200" height="150"/><circle cx="815" cy="186" r="18" fill="#a24f3a"/><text class="n" x="810" y="192">4</text>
    <text class="h" x="845" y="193">差异审阅</text><text class="body" x="810" y="230">openclaw.json 前后 diff</text><text class="body" x="810" y="255">检查模型与 Skill 改写</text><text class="small" x="810" y="282">未知键被删除也要审计</text>
    <path class="arrow" d="M985 230 L1022 230"/>
    <rect class="step" x="1025" y="155" rx="20" width="200" height="150"/><circle cx="1055" cy="186" r="18" fill="#a24f3a"/><text class="n" x="1050" y="192">5</text>
    <text class="h" x="1085" y="193">状态验证</text><text class="body" x="1050" y="230">session-sqlite dry-run</text><text class="body" x="1050" y="255">validate / inspect / backup</text><text class="small" x="1050" y="282">确认新旧会话可见性</text>
    <path class="arrow" d="M1225 230 L1262 230"/>
    <rect class="gate" x="1265" y="155" rx="20" width="270" height="150"/><circle cx="1295" cy="186" r="18" fill="#4f8a6d"/><text class="n" x="1290" y="192">6</text>
    <text class="h" x="1325" y="193">Canary Gate</text><text class="body" x="1290" y="230">插件、渠道、审批、备份</text><text class="body" x="1290" y="255">会话、Cron、模型路由</text><text class="small" x="1290" y="282">全部通过后才扩大流量</text>
  </g>

  <text class="h" x="70" y="365">实测暴露的高风险面</text>
  <rect class="risk" x="70" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="98" y="428">配置不是“原样兼容”</text>
  <text class="body" x="98" y="460">agents.list → agents.entries；default 标记移除</text>
  <text class="body" x="98" y="489">doctor 还写入 maxConcurrent=8、compaction 等默认值</text>
  <text class="small" x="98" y="523">风险：容量、行为与 GitOps diff 同时变化</text>

  <rect class="risk" x="568" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="596" y="428">模型路由的“名字相同，语义可能不同”</text>
  <text class="body" x="596" y="460">openai-codex/*、codex/* → openai/*</text>
  <text class="body" x="596" y="489">通过 model-scoped agentRuntime.id=codex 保留意图</text>
  <text class="small" x="596" y="523">风险：插件未安装/未授权时模型路由直接失败</text>

  <rect class="risk" x="1066" y="392" rx="20" width="465" height="172"/>
  <text class="h" x="1094" y="428">状态迁移具有方向性</text>
  <text class="body" x="1094" y="460">共享状态与会话进一步迁入 SQLite STRICT</text>
  <text class="body" x="1094" y="489">升级后创建的会话不一定被旧运行时识别</text>
  <text class="small" x="1094" y="523">风险：只回滚二进制，不等于回滚数据</text>

  <rect class="risk" x="70" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="98" y="631">doctor --fix 的写入范围可能越界</text>
  <text class="body" x="98" y="663">state-dir 隔离不约束配置中的绝对 workspace</text>
  <text class="body" x="98" y="692">TOOLS.md、AGENTS.md 等工作区文件可能被迁移</text>
  <text class="small" x="98" y="726">风险：副本配置仍指向生产路径时会误改生产文件</text>

  <rect class="risk" x="568" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="596" y="631">插件与 Provider 边界重组</text>
  <text class="body" x="596" y="663">官方 Provider 拆包；能力声明需要显式同意</text>
  <text class="body" x="596" y="692">OpenProse 与 /prose 移除；SDK 旧导入将退役</text>
  <text class="small" x="596" y="726">风险：插件可加载 ≠ 功能可用，需逐项回归</text>

  <rect class="risk" x="1066" y="595" rx="20" width="465" height="172"/>
  <text class="h" x="1094" y="631">默认行为变更</text>
  <text class="body" x="1094" y="663">会话 reset、主动记忆/梦境、并发与审批发生变化</text>
  <text class="body" x="1094" y="692">缺依赖 Skill 在 --fix 下可被批量禁用</text>
  <text class="small" x="1094" y="726">风险：升级成功但业务行为静默漂移</text>

  <rect class="rollback" x="70" y="810" rx="18" width="1460" height="75"/>
  <text class="h" x="98" y="841">回滚触发条件</text>
  <text class="body" x="275" y="841">会话缺失 / 模型路由变化 / 插件 capability 未批准 / Cron 重复或漏跑 / Gateway 连接失败 / SQLite 校验失败</text>
  <text class="small" x="98" y="868">回滚动作必须同时覆盖：旧二进制 + 旧配置 + 升级前数据快照；禁止只替换 npm 包</text>
</svg>
