apiVersion: v1
kind: Pod
metadata:
  name: crun-example
  namespace: oci-lab
spec:
  runtimeClassName: crun-lab
  nodeName: worker-lab
  restartPolicy: Never
  activeDeadlineSeconds: 90
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: docker.io/library/nginx:1.20.1-alpine
      imagePullPolicy: Never
      command:
        - /bin/sh
        - -ec
        - |
          echo CRUN_POD_STARTED
          ip -o -4 addr show eth0
          cat /proc/self/cgroup
          sleep 20
          echo CRUN_POD_COMPLETED
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 500m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
