apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc-lab
handler: kata-fc
overhead:
  podFixed:
    cpu: 250m
    memory: 130Mi
scheduling:
  nodeSelector:
    sandbox.aik8s.run/kata-fc: "true"
  tolerations:
    - key: sandbox.aik8s.run/kata-fc
      operator: Equal
      value: "true"
      effect: NoSchedule
