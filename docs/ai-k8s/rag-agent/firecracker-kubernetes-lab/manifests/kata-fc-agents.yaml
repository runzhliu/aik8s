apiVersion: v1
kind: Pod
metadata:
  name: kata-fc-openclaw
  namespace: agent-runtime
  labels:
    app.kubernetes.io/name: kata-fc-openclaw
    app.kubernetes.io/part-of: firecracker-agent-lab
    cubesandbox-agent-adapter-client: "true"
spec:
  runtimeClassName: kata-fc-lab
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  terminationGracePeriodSeconds: 5
  containers:
    - name: openclaw
      image: docker.io/firecracker-lab/openclaw:2026.8.2-amd64
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      envFrom:
        - secretRef:
            name: firecracker-agent-model
      env:
        - name: CUBE_ADAPTER_URL
          value: http://cube-agent-adapter-cubesandbox-agent-adapter.agent-runtime.svc:18080
        - name: CUBE_ADAPTER_TOKEN
          valueFrom:
            secretKeyRef:
              name: cube-adapter-auth
              key: token
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: plugin
          mountPath: /opt/cube-plugin
          readOnly: true
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: plugin
      configMap:
        name: firecracker-openclaw-plugin
    - name: workspace
      emptyDir: {}
---
