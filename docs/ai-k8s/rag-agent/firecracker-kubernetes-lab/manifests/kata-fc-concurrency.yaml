apiVersion: v1
kind: Namespace
metadata:
  name: firecracker-concurrency
  labels:
    app.kubernetes.io/part-of: firecracker-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kata-fc-concurrency
  namespace: firecracker-concurrency
  labels:
    app.kubernetes.io/name: kata-fc-concurrency
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-fc-concurrency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-fc-concurrency
    spec:
      runtimeClassName: kata-fc-lab
      terminationGracePeriodSeconds: 1
      containers:
        - name: sleeper
          image: docker.io/library/nginx:1.20.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              touch /tmp/ready
              while true; do sleep 3600; done
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/ready
            initialDelaySeconds: 0
            periodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
