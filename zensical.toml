[project.theme]
variant = "modern"
language = "zh"
custom_dir = "overrides"
logo = "assets/brand/aik8s-logo.png"
favicon = "assets/brand/favicon.png"
features = [
  "navigation.indexes",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"
