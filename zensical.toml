[project]
site_name = "AI & K8s 知识库"
site_description = "AI、Kubernetes、Linux 与基础设施笔记"
site_url = "https://aik8s.run/"
docs_dir = "docs"
site_dir = "site"
nav = [
  {"首页" = "index.md"},
  {"AI on K8s" = [
    "ai-k8s/index.md",
    {"算力、队列与数据" = [
      {"GPU 与异构资源调度" = "ai-k8s/gpu-scheduling.md"},
      {"队列、公平共享与多租户" = "ai-k8s/queue-multitenancy.md"},
      {"AI 数据、存储与缓存" = "ai-k8s/data-storage.md"},
      {"RDMA 与 AI 高速网络" = "ai-k8s/rdma-networking.md"},
    ]},
    {"训练、推理与 Agent" = [
      {"分布式训练平台" = "ai-k8s/distributed-training.md"},
      {"可靠性与故障恢复" = "ai-k8s/reliability.md"},
      {"LLM 推理平台" = "ai-k8s/llm-inference.md"},
      {"AI Agent 与沙箱" = "ai-k8s/agentic-workloads.md"},
      {"边缘 AI 与云边协同" = "ai-k8s/edge-ai.md"},
    ]},
    {"平台工程与治理" = [
      {"MLOps 与平台工程" = "ai-k8s/mlops.md"},
      {"GPU、训练与推理可观测性" = "ai-k8s/observability.md"},
      {"AI 平台安全与治理" = "ai-k8s/security-governance.md"},
      {"GPU 成本与容量规划" = "ai-k8s/cost-capacity.md"},
      {"性能基准与回归" = "ai-k8s/benchmarking.md"},
      {"平台运维与升级" = "ai-k8s/platform-operations.md"},
      {"落地路线图" = "ai-k8s/adoption-roadmap.md"},
    ]},
  ]},
  {"K3s 升级" = [
    "k3s-upgrade/index.md",
    {"升级与 DRA 预检报告" = "k3s-upgrade/report.md"},
  ]},
]

[project.theme]
variant = "modern"
language = "zh"
logo = "assets/brand/aik8s-logo.png"
favicon = "assets/brand/favicon.png"
features = [
  "navigation.indexes",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"
