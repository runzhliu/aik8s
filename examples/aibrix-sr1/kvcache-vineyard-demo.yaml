apiVersion: v1
kind: Namespace
metadata:
  name: aibrix-demo
---
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: KVCache
metadata:
  name: vineyard-demo
  namespace: aibrix-demo
  annotations:
    kvcache.orchestration.aibrix.ai/backend: vineyard
spec:
  mode: centralized
  metadata:
    etcd:
      runtime:
        replicas: 1
        # The official Vineyard image also contains the etcd binary used by the controller.
        image: aibrix/vineyardd:20241120
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  service:
    type: ClusterIP
    ports:
      - name: vineyard-rpc
        port: 9600
        targetPort: 9600
        protocol: TCP
  cache:
    replicas: 1
    image: aibrix/vineyardd:20241120
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi
