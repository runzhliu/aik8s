apiVersion: v1
kind: Namespace
metadata:
  name: aibrix-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aibrix-role-demo
  namespace: aibrix-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aibrix-role-demo-reader
  namespace: aibrix-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aibrix-role-demo-reader
  namespace: aibrix-demo
subjects:
  - kind: ServiceAccount
    name: aibrix-role-demo
    namespace: aibrix-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aibrix-role-demo-reader
---
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: StormService
metadata:
  name: aibrix-role-demo
  namespace: aibrix-demo
spec:
  # One RoleSet containing one Prefill Pod and one Decode Pod.
  replicas: 1
  stateful: false
  updateStrategy:
    type: InPlaceUpdate
  selector:
    matchLabels:
      app: aibrix-role-demo
  template:
    metadata:
      labels:
        app: aibrix-role-demo
    spec:
      roles:
        - name: prefill
          replicas: 1
          stateful: false
          template:
            metadata:
              labels:
                app: aibrix-role-demo
                role: prefill
                model.aibrix.ai/name: aibrix-role-demo
                model.aibrix.ai/port: "8000"
            spec:
              serviceAccountName: aibrix-role-demo
              containers:
                - name: llm-engine
                  # This is a CPU-only orchestration demo. It does not transfer real KV data.
                  image: aibrix/vllm-mock:nightly
                  imagePullPolicy: IfNotPresent
                  command: ["python3", "app.py", "--api_key", "test-key-1234567890"]
                  ports:
                    - name: http
                      containerPort: 8000
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: "1"
                      memory: 1Gi
        - name: decode
          replicas: 1
          stateful: false
          template:
            metadata:
              labels:
                app: aibrix-role-demo
                role: decode
                model.aibrix.ai/name: aibrix-role-demo
                model.aibrix.ai/port: "8000"
            spec:
              serviceAccountName: aibrix-role-demo
              containers:
                - name: llm-engine
                  # Replace this mock with a matched vLLM + NIXL image for a real P/D test.
                  image: aibrix/vllm-mock:nightly
                  imagePullPolicy: IfNotPresent
                  command: ["python3", "app.py", "--api_key", "test-key-1234567890"]
                  ports:
                    - name: http
                      containerPort: 8000
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: "1"
                      memory: 1Gi
