apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: mock-llama2-7b-custom-hpa
  namespace: aibrix-demo
  annotations:
    autoscaling.aibrix.ai/scale-up-cooldown-window: 0s
    autoscaling.aibrix.ai/scale-down-cooldown-window: 60s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mock-llama2-7b
  minReplicas: 2
  maxReplicas: 3
  scalingStrategy: HPA
  metricsSources:
    - metricSourceType: pod
      protocolType: http
      port: "8000"
      path: /metrics
      # Exposed through Prometheus Adapter as pods/gpu_cache_usage_perc.
      targetMetric: gpu_cache_usage_perc
      targetValue: "10"
