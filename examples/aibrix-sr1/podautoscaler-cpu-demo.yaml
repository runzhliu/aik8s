apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: aibrix-role-demo-kpa
  namespace: aibrix-demo
  annotations:
    autoscaling.aibrix.ai/storm-service-mode: replica
    autoscaling.aibrix.ai/scale-up-tolerance: "0"
    autoscaling.aibrix.ai/scale-down-tolerance: "0"
    autoscaling.aibrix.ai/scale-up-cooldown-window: 0s
    autoscaling.aibrix.ai/scale-down-cooldown-window: 0s
spec:
  scaleTargetRef:
    apiVersion: orchestration.aibrix.ai/v1alpha1
    kind: StormService
    name: aibrix-role-demo
  # In replica mode this role supplies the metric, while the whole RoleSet scales.
  subTargetSelector:
    roleName: prefill
  minReplicas: 1
  maxReplicas: 2
  scalingStrategy: KPA
  metricsSources:
    - metricSourceType: pod
      protocolType: http
      port: "8000"
      path: /metrics
      # This mock exposed 93 during the test; inspect /metrics before reusing the target.
      targetMetric: gpu_cache_usage_perc
      targetValue: "90"
