apiVersion: 1

datasources:
  - name: Kubernetes Tempo
    uid: kubernetes-tempo
    type: tempo
    access: proxy
    url: http://tempo.otel-k8s-monitoring.svc.cluster.local:3200
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
