apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroupSet
metadata:
  name: mock-inference-fleet
  namespace: rbg-demo
  labels:
    app.kubernetes.io/part-of: rbg-sr1-practice
spec:
  replicas: 2
  groupTemplate:
    labels:
      app.kubernetes.io/name: mock-inference-replica
    spec:
      roles:
        - name: router
          replicas: 1
          standalonePattern:
            template:
              spec:
                containers:
                  - name: router
                    image: nginx:1.27.4-alpine
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
        - name: worker
          replicas: 1
          dependencies:
            - router
          standalonePattern:
            template:
              spec:
                containers:
                  - name: worker
                    image: nginx:1.27.4-alpine
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
