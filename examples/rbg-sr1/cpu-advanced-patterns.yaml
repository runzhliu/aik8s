apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: mock-leader-worker
  namespace: rbg-demo
  labels:
    app.kubernetes.io/part-of: rbg-sr1-practice
spec:
  roles:
    - name: engine
      replicas: 1
      leaderWorkerPattern:
        size: 3
        restartPolicy:
          type: RecreateRoleInstanceOnPodRestart
          baseDelaySeconds: 0
          maxDelaySeconds: 0
        template:
          spec:
            containers:
              - name: engine
                image: nginx:1.27.4-alpine
                ports:
                  - name: http
                    containerPort: 80
                readinessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 2
                  periodSeconds: 2
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
        leaderTemplatePatch:
          metadata:
            labels:
              rbg-lab-role: leader
          spec:
            containers:
              - name: engine
                env:
                  - name: LAB_PROCESS_ROLE
                    value: leader
        workerTemplatePatch:
          metadata:
            labels:
              rbg-lab-role: worker
          spec:
            containers:
              - name: engine
                env:
                  - name: LAB_PROCESS_ROLE
                    value: worker

---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: mock-components
  namespace: rbg-demo
  labels:
    app.kubernetes.io/part-of: rbg-sr1-practice
spec:
  roles:
    - name: engine
      replicas: 1
      customComponentsPattern:
        restartPolicy:
          type: RecreateRoleInstanceOnPodRestart
          baseDelaySeconds: 0
          maxDelaySeconds: 0
        components:
          - name: runtime
            size: 2
            template:
              spec:
                containers:
                  - name: runtime
                    image: nginx:1.27.4-alpine
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
          - name: monitor
            size: 1
            template:
              metadata:
                annotations:
                  rbg.workloads.x-k8s.io/restart-trigger-policy: Ignore
              spec:
                containers:
                  - name: monitor
                    image: nginx:1.27.4-alpine
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 80
                      initialDelaySeconds: 2
                      periodSeconds: 2
                    resources:
                      requests:
                        cpu: 20m
                        memory: 32Mi
                      limits:
                        cpu: 200m
                        memory: 128Mi
