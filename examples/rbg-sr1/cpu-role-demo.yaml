apiVersion: v1
kind: Namespace
metadata:
  name: rbg-demo
---
apiVersion: workloads.x-k8s.io/v1alpha2
kind: RoleBasedGroup
metadata:
  name: mock-pd
  namespace: rbg-demo
  labels:
    app.kubernetes.io/name: mock-pd
    app.kubernetes.io/part-of: rbg-sr1-practice
spec:
  roles:
    - name: gateway
      replicas: 1
      standalonePattern:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: gateway
          spec:
            containers:
              - name: gateway
                image: nginx:1.27.4-alpine
                ports:
                  - name: http
                    containerPort: 80
                readinessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 2
                  periodSeconds: 2
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi

    - name: prefill
      replicas: 2
      dependencies:
        - gateway
      scalingAdapter:
        enable: true
      standalonePattern:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: prefill
          spec:
            containers:
              - name: prefill
                image: nginx:1.27.4-alpine
                ports:
                  - name: http
                    containerPort: 80
                readinessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 2
                  periodSeconds: 2
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi

    - name: decode
      replicas: 2
      dependencies:
        - prefill
      scalingAdapter:
        enable: true
      standalonePattern:
        template:
          metadata:
            labels:
              app.kubernetes.io/component: decode
          spec:
            containers:
              - name: decode
                image: nginx:1.27.4-alpine
                ports:
                  - name: http
                    containerPort: 80
                readinessProbe:
                  httpGet:
                    path: /
                    port: http
                  initialDelaySeconds: 2
                  periodSeconds: 2
                resources:
                  requests:
                    cpu: 20m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi

---
# A CoordinatedPolicy is discovered by exact namespace/name match with the RBG.
# With equal 2 -> 4 targets, 25% maxSkew advances both roles one Ready replica
# at a time instead of creating all replicas in a single burst.
apiVersion: workloads.x-k8s.io/v1alpha2
kind: CoordinatedPolicy
metadata:
  name: mock-pd
  namespace: rbg-demo
spec:
  policies:
    - name: prefill-decode-scaling
      roles:
        - prefill
        - decode
      strategy:
        scaling:
          maxSkew: "25%"
          progression: OrderReady
    - name: prefill-decode-rollout
      roles:
        - prefill
        - decode
      strategy:
        rollingUpdate:
          maxSkew: "50%"
          maxUnavailable: 1
