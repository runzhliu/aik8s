apiVersion: v1
kind: Namespace
metadata:
  name: higress-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: higress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /www && echo 'higress-sr1-ok' > /www/index.html && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: higress-lab
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: higress-lab
spec:
  ingressClassName: higress-sr1
  rules:
    - host: echo.higress.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
