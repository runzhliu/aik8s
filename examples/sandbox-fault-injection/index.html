<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Sandbox Fault Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#25324a;font:14px/1.5 system-ui,sans-serif}main{max-width:1110px;margin:22px auto}h1{font-size:27px;margin:0}p{color:#687690;margin:8px 0 15px}.tag{font-size:13px;background:#edeaff;color:#6553d6;padding:6px 10px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.card,section{background:white;border:1px solid #dce3f0;border-radius:12px;padding:16px}.value{font-size:28px;color:#6553d6}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #e8edf4}th{color:#72809a;font-size:13px}.good{color:#148470}.bad{color:#ca4050}small{font-size:12px;color:#73809a}a{color:#6553d6}footer{margin-top:13px}.tabs a{display:inline-block;margin-right:16px;font-size:14px}</style><main><a id="lang" style="float:right;font-size:13px" href="#en" onclick="location.hash=location.hash==='#en'?'':'en';location.reload();return false">中文 / English</a><h1 id="title">沙箱故障注入 · 真实观测 <span class="tag">Kubernetes · KVM</span></h1><p id="intro">新建 TCP 连接 · 允许 / 禁止目标对照 · guest 心跳与接收端交叉验证</p><div class="tabs"><a href="?group=sdk" id="sdk">SDK / microVM</a><a href="?group=platform" id="platform">平台控制面 / 任务</a></div><div class="stats"><div class="card"><span id="n-label">已完成故障场景</span><div class="value" id="n">—</div></div><div class="card"><span id="denied-label">限制场景中禁止目标收到请求</span><div class="value" id="denied">—</div></div><div class="card"><span id="cleanup-label">故障后未回收 KVM 进程</span><div class="value" id="cleanup">—</div></div></div><section><table><thead><tr><th>运行时 / 故障点</th><th>允许请求：前 → 后</th><th>禁止请求：前 → 后</th><th>故障后的执行状态</th></tr></thead><tbody id="rows"></tbody></table></section><footer><small id="note">本文配套观测页，非官方 Console。数字为独立目标收到的新 HTTP 请求；0 次接收不等于已证明所有协议安全。</small></footer></main><script>const en=location.hash==='#en',group=new URLSearchParams(location.search).get('group')||'sdk',tx=(a,b)=>en?b:a;const labels={sdk:['SDK 客户端 SIGKILL','SDK client SIGKILL'],vmm:['VMM SIGKILL','VMM SIGKILL'],proxy:['网络代理 SIGKILL','Network proxy SIGKILL'],pod:['承载 Pod 重建','Hosting Pod recreation'],api:['API 暂停','API unavailable'],controller:['Controller 暂停','Controller unavailable'],task:['任务 Pod 终止','Task Pod termination'],controlplane:['API + Controller 停止','API + Controller stopped']};async function refresh(){const s=await(await fetch('/state')).json();const all=s.records.filter(r=>r.status==='measured'&&r.fault!=='control');const rows=all.filter(r=>(group==='platform')===['opensandbox','cubesandbox'].includes(r.engine));document.getElementById('n').textContent=rows.length;document.getElementById('denied').textContent=rows.reduce((n,r)=>n+(r.received?.after?.deny||0),0);document.getElementById('cleanup').textContent=rows.reduce((n,r)=>n+(r.remaining_kvm_processes||0),0);if(group==='platform'){document.getElementById('intro').textContent=tx('API 与 Controller 完全退出后观测同一任务 Pod；本组两个目标均允许访问','Observe the same task Pod after API and Controller exit; both destinations are allowed');document.querySelector('.tag').textContent=tx('Kubernetes · 普通容器','Kubernetes · container');document.getElementById('denied').textContent='N/A';document.getElementById('denied-label').textContent=tx('本组未配置出口策略','No egress policy in this group');document.getElementById('cleanup-label').textContent=tx('测试任务清理','Test task cleanup');document.getElementById('cleanup').textContent=tx('已删除','Removed');document.querySelectorAll('th')[1].textContent=tx('目标 A：前 → 后','Target A: before → after');document.querySelectorAll('th')[2].textContent=tx('目标 B：前 → 后','Target B: before → after')};let body=document.getElementById('rows');body.replaceChildren();for(const r of rows){const b=r.received.before,a=r.received.after;let msg=r.effect_zh||'';if(en)msg=r.effect_en||msg;const texts=[r.engine+' · '+(labels[r.fault]||[r.fault,r.fault])[en?1:0],b.allow+' → '+a.allow,b.deny+' → '+a.deny,msg];const tr=document.createElement('tr');for(const t of texts){const td=document.createElement('td');td.textContent=t;tr.appendChild(td)}tr.children[2].className=r.policy_enforced===false?'':a.deny?'bad':'good';body.appendChild(tr)}}if(en){document.documentElement.lang='en';document.getElementById('title').innerHTML='Sandbox fault injection · measured <span class="tag">Kubernetes · KVM</span>';document.getElementById('intro').textContent='Fresh TCP connections · allowed / denied controls · guest heartbeat and independent receivers';for(const [id,text]of Object.entries({'n-label':'Completed fault scenarios','denied-label':'Denied-target receipts under restrictions','cleanup-label':'Unreclaimed KVM processes after cleanup',platform:'Platform control / tasks',note:'Article evidence viewer, not an official Console. Counts are new HTTP requests received by independent targets; zero receipts do not establish safety for every protocol.'}))document.getElementById(id).textContent=text;document.querySelectorAll('th').forEach((e,i)=>e.textContent=['Runtime / fault','Allowed: before → after','Denied: before → after','Execution after fault'][i])}refresh();setInterval(refresh,2000)</script></html>
