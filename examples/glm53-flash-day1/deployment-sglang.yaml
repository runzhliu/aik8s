apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-flash-sglang
  namespace: glm53-flash-lab
  labels:
    app.kubernetes.io/name: glm53-flash-sglang
    app.kubernetes.io/part-of: glm53-flash-day1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glm53-flash-sglang
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm53-flash-sglang
        app.kubernetes.io/part-of: glm53-flash-day1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 180
      # Replace with a verified Hopper large-memory GPU pool label.
      nodeSelector:
        accelerator.example.com/model: hopper-large-memory
      containers:
        - name: sglang
          image: lmsysorg/sglang@sha256:0836f0160fa785e424e68d13ef88ddd548f87e6e11ad9f0e4de982e4f9188aaf
          imagePullPolicy: IfNotPresent
          command: ["sglang", "serve"]
          args:
            - --model-path
            - /models/GLM-5.3-Flash
            - --served-model-name
            - glm53-flash
            - --host
            - 0.0.0.0
            - --port
            - "30000"
            - --tp-size
            - "4"
            - --ep-size
            - "4"
            - --attention-backend
            - dsa
            - --dsa-prefill-backend
            - tilelang
            - --dsa-decode-backend
            - tilelang
            - --linear-attn-backend
            - triton
            - --kv-cache-dtype
            - bfloat16
            - --quantization
            - fp8
            - --moe-runner-backend
            - deep_gemm
            - --max-running-requests
            - "32"
            - --chunked-prefill-size
            - "8192"
            - --max-prefill-tokens
            - "8192"
            - --disable-shared-experts-fusion
            - --disable-prefill-cuda-graph
            - --mem-fraction-static
            - "0.82"
            - --reasoning-parser
            - glm45
            - --tool-call-parser
            - glm47
            - --enable-metrics
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
          ports:
            - name: http
              containerPort: 30000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 540
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "64"
              memory: 700Gi
              ephemeral-storage: 16Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "160"
              memory: 1000Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "4"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: model-corpus
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: cache
              mountPath: /root/.cache
      volumes:
        - name: model-corpus
          persistentVolumeClaim:
            claimName: glm53-flash-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: cache
          emptyDir:
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-flash-sglang
  namespace: glm53-flash-lab
spec:
  selector:
    app.kubernetes.io/name: glm53-flash-sglang
  ports:
    - name: http
      port: 30000
      targetPort: http
