apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-flash-vllm
  namespace: glm53-flash-lab
  labels:
    app.kubernetes.io/name: glm53-flash-vllm
    app.kubernetes.io/part-of: glm53-flash-day1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glm53-flash-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm53-flash-vllm
        app.kubernetes.io/part-of: glm53-flash-day1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 180
      # Replace with a verified Hopper large-memory GPU pool label.
      nodeSelector:
        accelerator.example.com/model: hopper-large-memory
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:2e771fa615452282cc331eb418b3ef21636fce355bea0491fca89e6d362ab703
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/GLM-5.3-Flash
            - --served-model-name
            - glm53-flash
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - "4"
            - --kv-cache-dtype
            - bfloat16
            - --max-model-len
            - "1048576"
            - --max-num-seqs
            - "32"
            - --enable-prefix-caching
            - --enable-auto-tool-choice
            - --tool-call-parser
            - glm47
            - --reasoning-parser
            - glm45
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            # Only expose the development cache-reset endpoint inside this
            # isolated benchmark namespace. Remove it for production.
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 540
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "64"
              memory: 700Gi
              ephemeral-storage: 16Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "160"
              memory: 1000Gi
              ephemeral-storage: 64Gi
              nvidia.com/gpu: "4"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: model-corpus
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: cache
              mountPath: /root/.cache
      volumes:
        - name: model-corpus
          persistentVolumeClaim:
            claimName: glm53-flash-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: cache
          emptyDir:
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-flash-vllm
  namespace: glm53-flash-lab
spec:
  selector:
    app.kubernetes.io/name: glm53-flash-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
