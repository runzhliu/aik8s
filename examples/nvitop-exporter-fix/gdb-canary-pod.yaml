apiVersion: v1
kind: Namespace
metadata:
  name: aik8s-ms
---
apiVersion: v1
kind: Pod
metadata:
  name: nvitop-exporter-gdb-canary
  namespace: aik8s-ms
  labels:
    app.kubernetes.io/name: nvitop-exporter-gdb-canary
spec:
  # Replace before applying. Keep the production node identity out of Git.
  nodeName: <h20-node-name>
  restartPolicy: Always
  tolerations:
    - operator: Exists
  containers:
    - name: debugger
      image: <production-registry>/nvitop-exporter:v1.7.1-nvml13.580.126-debug
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
      args:
        - |
          ulimit -c unlimited
          exec gdb --batch \
            -ex 'set pagination off' \
            -ex 'set print thread-events off' \
            -ex 'run' \
            -ex 'thread apply all bt full' \
            -ex 'generate-core-file /apps/logs/core.nvitop-exporter' \
            --args /venv/bin/python -m nvitop_exporter \
              --bind-address 127.0.0.1 \
              --port 15050 \
              --interval 1
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: PYTHONUNBUFFERED
          value: "1"
      securityContext:
        privileged: true
        capabilities:
          add:
            - SYS_PTRACE
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeMounts:
        - name: cores
          mountPath: /apps/logs
  volumes:
    - name: cores
      emptyDir:
        sizeLimit: 2Gi
