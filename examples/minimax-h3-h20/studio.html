<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax H3 · 音视频生成</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#182b40;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:48px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:13px;font-weight:650;letter-spacing:2px;color:#387ba2}h1{font-size:38px;line-height:1.2;margin:10px 0}header p{color:#5d7083;margin:10px 0}.badge{border:1px solid #cedce7;border-radius:20px;padding:6px 14px;font-size:13px;background:white}.grid{display:grid;grid-template-columns:380px 1fr;gap:24px}.card{background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:26px;box-shadow:0 4px 20px #163b5710}label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}textarea,input,select{width:100%;padding:12px;border:1px solid #cfdae4;border-radius:9px;font:inherit;background:#fff;color:inherit}textarea{height:220px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}button{width:100%;padding:13px;border:0;border-radius:10px;background:#146c92;color:#fff;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.6}h2{font-size:19px;margin:0 0 18px}.screen{background:#edf3f7;border:1px solid #dde7ee;aspect-ratio:16/9;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.screen p{text-align:center;color:#6e8396;font-size:14px}video{width:100%;height:100%;background:#eff3f6}.status{margin:20px 0 12px;font-size:15px}.details{font-size:12px;color:#6c7f90;overflow-wrap:anywhere}.download{display:inline-block;margin-top:15px;color:#146c92;font-weight:600;text-decoration:none}.hint{font-size:13px;color:#738396;margin-top:16px}footer{margin-top:26px;color:#84929f;font-size:12px} @media(max-width:800px){main{margin-top:24px}.grid{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:12px}h1{font-size:30px}}
</style><main><header><div><div class="brand">AI-K8S · VIDEO LAB</div><h1>MiniMax H3</h1><p>描述一个场景，让画面和声音一起发生。</p></div><span class="badge" id="engine">正在连接服务</span></header><div class="grid"><section class="card"><label for="prompt">场景描述</label><textarea id="prompt">固定镜头，一辆红色玩具小汽车缓慢驶过木桌，停在蓝色方块旁。车轮发出轻微的咔嗒声，停下后房间恢复安静。</textarea><div class="row"><div><label for="seconds">视频时长</label><select id="seconds"><option value="5">5 秒</option><option value="10">10 秒</option><option value="15">15 秒</option></select></div><div><label for="seed">随机种子</label><input id="seed" type="number" value="1101"></div></div><button id="generate">生成音视频</button><p class="hint">生成过程需要一些时间。完成后可播放、听声音并下载原始视频。</p></section><section class="card"><h2>生成结果</h2><div class="screen" id="screen"><p>你的下一段故事<br>将在这里呈现</p></div><p class="status" id="status">准备就绪</p><div class="details" id="details"></div><a hidden class="download" id="download">下载原始 MP4 ↓</a></section></div><footer>AI-K8S 技术工程 · 实际生成记录 · 保留原始音视频</footer></main><script>
const $=id=>document.getElementById(id);let current;
fetch('/api/info').then(r=>r.json()).then(x=>{$('engine').textContent=x.engine+' · '+(x.variant==='fl2va'?'文本生成':'参考图生成');if(x.variant==='ref2va')$('prompt').value='Use <Picture 1> as the visual subject. A red toy car rolls slowly across a wooden table beside a blue cube, with soft wheel sounds.'});
async function poll(){const r=await fetch('/api/jobs/'+current),j=await r.json();$('status').textContent={queued:'已排队，等待生成',generating:'正在生成画面与声音…',completed:'生成完成',failed:'生成失败，记录已保留'}[j.status]||j.status;if(j.status==='completed'){const v=document.createElement('video');v.controls=true;v.src='/media/'+current+'.mp4';$('screen').replaceChildren(v);$('details').textContent=`${j.result.media.streams[0].width} × ${j.result.media.streams[0].height} · ${j.result.duration_s.toFixed(2)} 秒 · 耗时 ${j.result.e2e_s.toFixed(1)} 秒 · 请求 ${current}`;$('download').href=v.src;$('download').download='minimax-h3-'+current+'.mp4';$('download').hidden=false;$('generate').disabled=false}else if(j.status==='failed'){$('details').textContent=j.result.error;$('generate').disabled=false}else setTimeout(poll,2000)}
$('generate').onclick=async()=>{$('generate').disabled=true;$('download').hidden=true;try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:$('prompt').value,seconds:Number($('seconds').value),seed:Number($('seed').value)})}),j=await r.json();if(!r.ok)throw Error(j.error);current=j.id;$('details').textContent='请求 '+current;poll()}catch(e){$('status').textContent=e.message;$('generate').disabled=false}};
</script></html>
