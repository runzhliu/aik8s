apiVersion: v1
kind: Service
metadata:
  name: opensandbox-controller-metrics
  namespace: opensandbox-lab
  labels:
    experiment: opensandbox-lab
    metrics_job: opensandbox-controller
spec:
  clusterIP: None
  selector:
    control-plane: controller-manager
    app.kubernetes.io/instance: osb-lab-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: opensandbox-lab
  namespace: victoriametrics
spec:
  jobLabel: metrics_job
  namespaceSelector:
    matchNames: [opensandbox-lab]
  selector:
    matchLabels:
      experiment: opensandbox-lab
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
