apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-reader
  namespace: apf-case
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-reader
  namespace: apf-case
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fixture
  namespace: apf-case
data:
  message: APF read-only isolation example
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fixture-reader
  namespace: apf-case
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [fixture]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fixture-readers
  namespace: apf-case
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fixture-reader
subjects:
  - kind: ServiceAccount
    name: batch-reader
    namespace: apf-case
  - kind: ServiceAccount
    name: control-reader
    namespace: apf-case
