apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-sglang-day1
  namespace: glm53-lab
  labels:
    app.kubernetes.io/name: glm53-sglang-day1
    app.kubernetes.io/part-of: glm53-day1
spec:
  replicas: 1
  progressDeadlineSeconds: 7200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glm53-sglang-day1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm53-sglang-day1
        app.kubernetes.io/part-of: glm53-day1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "30000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 180
      # Replace with a verified Hopper large-memory GPU pool label.
      nodeSelector:
        accelerator.example.com/model: hopper-large-memory
      containers:
        - name: sglang
          image: lmsysorg/sglang@sha256:bde16a8447b19e89056b9eea06c72be6c02801dc89d528c9ea90c53368fd74bf
          imagePullPolicy: IfNotPresent
          command: ["sglang", "serve"]
          args:
            - --model-path
            - /models/GLM-5.3/v1
            - --served-model-name
            - glm-5.3
            - --host
            - 0.0.0.0
            - --port
            - "30000"
            - --tp-size
            - "8"
            - --context-length
            - "131072"
            - --max-running-requests
            - "32"
            - --chunked-prefill-size
            - "32768"
            - --mem-fraction-static
            - "0.80"
            - --disable-radix-cache
            - --reasoning-parser
            - glm45
            - --tool-call-parser
            - glm47
            - --watchdog-timeout
            - "1200"
            - --enable-metrics
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
          ports:
            - name: http
              containerPort: 30000
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 720
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "120"
              memory: 700Gi
              ephemeral-storage: 32Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "240"
              memory: 1500Gi
              ephemeral-storage: 96Gi
              nvidia.com/gpu: "8"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: model-corpus
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: cache
              mountPath: /root/.cache
      volumes:
        - name: model-corpus
          persistentVolumeClaim:
            claimName: glm53-models
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Gi
        - name: cache
          emptyDir:
            sizeLimit: 64Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-sglang-day1
  namespace: glm53-lab
spec:
  selector:
    app.kubernetes.io/name: glm53-sglang-day1
  ports:
    - name: http
      port: 30000
      targetPort: http
