<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CubeSandbox 故障演练实测记录</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fd;color:#27364f;font:17px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1200px;margin:auto;padding:18px 25px}header{display:flex;align-items:start;justify-content:space-between}h1{font-size:25px;font-weight:600;margin:0 0 5px}p{margin:0;color:#76849b;font-size:14px}a{color:#3858e9;text-decoration:none}nav{display:flex;gap:18px;margin:12px 0;font-size:16px}nav a.active{border-bottom:3px solid #3157f6;padding-bottom:5px}.badge{font-size:13px;background:#e7edff;color:#3356d7;padding:5px 10px;border-radius:7px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px}.card{background:#fff;border:1px solid #dde4f1;border-radius:12px;padding:10px 16px}.label{color:#7a879d;font-size:14px}.value{font-size:29px;color:#3458f5;margin-top:4px}section{background:white;border:1px solid #dce3f1;border-radius:13px;padding:12px 16px}table{border-collapse:collapse;width:100%;font-size:17px}th{text-align:left;color:#6f7e98;font-weight:500;font-size:14px;background:#f6f8fd}td,th{padding:9px 10px;border-bottom:1px solid #e7ecf5}tbody tr:last-child td{border:0}.ok{color:#118574}.warn{color:#c17b1c}.bad{color:#ca536c}.muted{color:#92a0b5;font-size:14px}footer{margin-top:10px;color:#8190a8;font-size:13px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:10px}.detail strong{font-size:21px;font-weight:500}.detail p{font-size:15px;margin-top:5px}code{font-size:15px;color:#61728e}@media(max-width:700px){main{padding:15px}h1{font-size:22px}.cards{gap:7px}.card{padding:10px}.value{font-size:23px}section{overflow:auto;padding:8px}table{min-width:680px}.detail{grid-template-columns:1fr}}</style>
<main><header><div><h1 id="title"></h1><p id="sub"></p></div><div><span class="badge" id="badge"></span>　<a href="#en" id="language">中文 / English</a></div></header><nav id="nav"></nav><div class="cards" id="cards"></div><section><table><thead id="head"></thead><tbody id="rows"></tbody></table></section><div class="detail" id="detail"></div><footer id="footer"></footer></main>
<script>
let report;const english=()=>location.hash==='#en';const tr=(zh,en)=>english()?en:zh;const group=new URLSearchParams(location.search).get('group')||'control';
const groups={control:['api','master','ops','proxy','cubelet'],runtime:['vmm','pod','egress-l3','egress-l7'],dependencies:['mysql','redis','minio']};
const labels={api:'CubeAPI',master:'CubeMaster',ops:'CubeOps',proxy:'CubeProxy',cubelet:'Cubelet',vmm:'VMM / Rust Shim',pod:'cube-node Pod',mysql:'MySQL',redis:'Redis',minio:'MinIO','egress-l3':'CubeEgress · L3','egress-l7':'CubeEgress · L7'};
function render(){document.documentElement.lang=english()?'en':'zh-CN';document.querySelector('#title').textContent=tr('CubeSandbox：组件故障与恢复实测','CubeSandbox: component failure and recovery');document.querySelector('#sub').textContent=tr('实际运行时 v0.7.3 · 独立接收端 · 同一物理节点 · IPv4 HTTP 新连接','Verified runtime v0.7.3 · independent receiver Pods · one physical node · fresh IPv4 HTTP connections');document.querySelector('#badge').textContent=tr('真实测试记录','Measured evidence');
document.querySelector('#nav').innerHTML=Object.keys(groups).map(k=>`<a class="${k===group?'active':''}" href="?group=${k}${english()?'#en':''}">${({control:tr('控制面与节点管理','Control plane'),runtime:tr('运行时与网络','Runtime / network'),dependencies:tr('数据库与存储依赖','Dependencies')})[k]}</a>`).join('');
const latest={};for(const r of report.current)latest[r.profile]=r;const selected=groups[group].map(k=>latest[k]).filter(Boolean);const injected=selected.filter(r=>r.injected);const denied=injected.reduce((sum,r)=>sum+(r.receipts.fault?.deny||0),0);const verified=selected.filter(r=>r.cleanup?.new_sandbox_exec&&r.cleanup?.remaining_sandboxes===0).length;
document.querySelector('#cards').innerHTML=[[tr('已注入 / 本页场景','Injected / displayed profiles'),injected.length+' / '+groups[group].length],[tr('故障窗口 · 禁止目标实际接收','Denied receipts during fault'),denied],[tr('新建执行与清理验收','New-task execution and cleanup'),verified+' / '+selected.length]].map(([a,b])=>`<div class="card"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');
document.querySelector('#head').innerHTML='<tr>'+[tr('组件','Component'),tr('故障动作','Action'),tr('允许接收 前 → 故障','Allowed: before → fault'),tr('禁止接收','Denied'),tr('任务结果','Task outcome')].map(x=>'<th>'+x+'</th>').join('')+'</tr>';
document.querySelector('#rows').innerHTML=groups[group].map(k=>{const r=latest[k];if(!r)return `<tr><td>${labels[k]}</td><td colspan="4" class="muted">${tr('尚未执行','Not run yet')}</td></tr>`;const b=r.receipts.baseline?.allow;const f=r.receipts.fault?.allow;let action=tr('服务缩容至 0','Scale service to 0');if(k==='cubelet'||k==='egress-l3'||k==='egress-l7')action='SIGSTOP → SIGCONT';if(k==='vmm')action='SIGKILL';if(k==='pod')action=tr('Pod 删除重建','Recreate Pod');let outcome=r.task_recovered?tr('原任务继续','Original task continues'):tr('观察窗口内未恢复','Not recovered in window');if(k==='pod'&&r.controller_result==='ERROR')outcome=tr('未自动恢复；显式恢复失败','No auto-recovery; explicit restore failed');if(k==='vmm'&&r.snapshot_memory_equal)outcome=tr('显式快照恢复成功','Explicit snapshot restored');if(r.status==='BLOCKED_BASELINE'){action=tr('基线失败，未注入','Baseline failed; no injection');outcome=tr('允许请求也不可达','Allowed path unavailable');}return `<tr><td>${labels[k]}</td><td>${action}</td><td>${b??'—'} → ${f??'—'}</td><td class="${r.receipts.fault?.deny?'bad':'ok'}">${r.injected?r.receipts.fault?.deny??'—':'N/A'}</td><td class="${r.task_recovered?'ok':'warn'}">${outcome}</td></tr>`}).join('');
let detail='';const v=latest.vmm;if(group==='runtime'&&v?.snapshot_state&&v?.restored_state)detail=`<section><div class="label">${tr('快照 → 强杀前 → 恢复后的内存计数','Snapshot → pre-kill → restored memory counter')}</div><strong>${v.snapshot_state.counter} → ${v.before_vmm_kill?.counter??'—'} → ${v.restored_state.counter}</strong><p>${tr('随机身份、PID、摘要一致；恢复动作由测试程序显式发起。','Identity, PID and digest match; recovery was explicitly requested.')}</p></section><section><div class="label">${tr('未被故障注入的对照沙箱','Unaffected witness sandbox')}</div><strong>${v.witness_initial?.counter??'—'} → ${v.witness_after?.counter??'—'}</strong><p>${tr('检查同节点另一个任务是否继续推进。','A second task on the same node continues advancing.')}</p></section>`;
document.querySelector('#detail').innerHTML=detail;document.querySelector('#footer').textContent=tr('本页为原始测量数据生成的观测页，并非官方 Console。不同窗口长度不同；0 次禁止请求只覆盖本轮流量。','Custom evidence viewer generated from raw records, not the official Console. Window lengths differ; zero denied receipts covers only this traffic.');}
fetch('results.json').then(r=>r.json()).then(r=>{report=r;render()}).catch(e=>{document.querySelector('#title').textContent='Evidence not loaded: '+e.message});window.addEventListener('hashchange',render);
</script></html>
