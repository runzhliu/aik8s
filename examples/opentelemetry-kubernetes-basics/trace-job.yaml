apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen-traces
  namespace: otel-basics
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.158.0
          args:
            - traces
            - --otlp-endpoint=otel-collector.otel-basics.svc.cluster.local:4317
            - --otlp-insecure
            - --traces=5
            - --otlp-attributes=service.name="checkout-demo"
            - --telemetry-attributes=http.request.method="GET"
            - --telemetry-attributes=http.response.status_code=200
