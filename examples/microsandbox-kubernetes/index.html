<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Microsandbox SDK Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#25324a;font:15px/1.5 system-ui,sans-serif}main{max-width:1110px;margin:14px auto}h1{font-size:27px;margin:0}p{color:#687690;margin:7px 0 15px}.tag{font-size:13px;background:#edeaff;color:#6553d6;padding:6px 10px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.card,section{background:white;border:1px solid #dce3f0;border-radius:12px;padding:12px 16px}.value{font-size:27px;color:#6553d6}table{width:100%;border-collapse:collapse}th,td{padding:5px 8px;text-align:left;border-bottom:1px solid #e8edf4}th{color:#72809a;font-size:13px}.passed{color:#148470}.failed{color:#ca4050}button{cursor:pointer;background:#6553d6;border:0;border-radius:7px;padding:8px 12px;color:white;margin-right:8px}button:disabled{opacity:.5;cursor:wait}small{font-size:12px;color:#73809a}a{color:#6553d6}footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
</style><main><a style="float:right;font-size:13px" href="#en" onclick="location.hash=location.hash==='#en'?'':'en';location.reload();return false">中文 / English</a><h1>Microsandbox · microVM 实验 <span class="tag">SDK v0.7.8 · KVM</span></h1><p id="intro">独立内核 → 执行与隔离 → Live Fork → Pod 重建后的内存恢复</p><div class="stats"><div class="card"><span id="phase-label">实验状态</span><div class="value" id="phase">—</div></div><div class="card"><span id="passed-label">通过检查</span><div class="value" id="passed">—</div></div><div class="card"><span id="failed-label">失败检查</span><div class="value" id="failed">—</div></div></div><section><table><thead><tr><th>实际验证项</th><th>结果</th><th>测量与证据</th></tr></thead><tbody id="rows"></tbody></table></section><footer><div><button id="suite" onclick="run('suite')">运行实验</button><button id="restore" onclick="run('restore')">验证快照恢复</button></div><small id="note">本文配套 SDK 实验页，非官方 Console。数据来自实际 microVM 操作；完整快照与磁盘恢复分别校验。</small></footer></main><script>
const en=location.hash==='#en';const labels={cached_start:['缓存镜像后创建 · 10 次','Cached-image create · 10 samples'],warm_exec:['环境内执行 Python · 20 次','Python exec · 20 samples'],isolation:['内核 / 文件隔离与文件回传','Kernel / file separation and transfer'],timeout:['2 秒执行期限','2-second execution deadline'],parallel_cpu:['4 个 microVM 并发 CPU 任务','Four concurrent CPU tasks'],live_fork:['Live Fork · 复制内存状态','Live Fork · in-memory state'],snapshot_prepare:['保存完整与磁盘快照','Save full and disk snapshots'],snapshot_verify:['Pod 重建后恢复','Restore after Pod recreation'],parallel_cpu_repeat:['4 个 microVM 资源复测','Four-guest resource repeat']};const tx=(a,b)=>en?b:a;const fmt=x=>(1000*x).toFixed(1)+' ms';function detail(r){if(r.status!=='passed')return tx('失败保留于原始记录','Failure retained in raw records');if(['cached_start','warm_exec'].includes(r.test)){let a=[...r.samples_seconds].sort((a,b)=>a-b),n=a.length;return 'P50 '+fmt((a[n/2-1]+a[n/2])/2)+' · '+n+'/'+n};if(r.test==='isolation')return tx('不同 boot_id · 文件互不可见 · SHA-256 一致','Different boot IDs · separate files · matching SHA-256');if(r.test==='timeout')return fmt(r.elapsed_seconds)+' · '+r.behavior+' · '+tx('仍可执行','guest usable');if(r.test.startsWith('parallel_cpu'))return '4 × 1 vCPU / 512 MiB · '+r.elapsed_seconds.toFixed(2)+' s';if(r.test==='live_fork')return fmt(r.fork_seconds)+' · '+tx('内存 nonce 相同 · 分支计数 41 / 42','Same RAM nonce · branch counters 41 / 42');if(r.test==='snapshot_prepare')return tx('完整 + 磁盘归档已保存 · 源实例已停止','Full + disk archives saved · source stopped');if(r.test==='snapshot_verify')return tx('完整：内存保留 '+fmt(r.full.restore_seconds)+' · 磁盘：重新启动 '+fmt(r.disk.restore_seconds),'Full: RAM retained '+fmt(r.full.restore_seconds)+' · Disk: rebooted '+fmt(r.disk.restore_seconds));return ''}async function run(path){const r=await fetch('/api/'+path,{method:'POST'});if(!r.ok)alert(await r.text());refresh()}async function refresh(){const s=await(await fetch('/api/state')).json();document.getElementById('phase').textContent=s.busy?tx('运行中','Running'):tx('就绪','Ready');for(const k of ['passed','failed'])document.getElementById(k).textContent=s.records.filter(r=>r.status===k).length;document.querySelectorAll('button').forEach(e=>e.disabled=s.busy);if(s.records.some(r=>r.test==='snapshot_prepare'&&r.status==='passed'&&r.attempt===s.attempt)){document.getElementById('suite').disabled=true;document.getElementById('suite').textContent=tx('本轮已完成','Attempt complete')};const rows=document.getElementById('rows');rows.replaceChildren();for(const r of s.records){const tr=document.createElement('tr');for(const text of [(labels[r.test]||[r.test,r.test])[en?1:0],r.status.toUpperCase(),detail(r)]){const td=document.createElement('td');td.textContent=text;tr.appendChild(td)}tr.children[1].className=r.status;rows.appendChild(tr)}}if(en){document.documentElement.lang='en';document.querySelector('h1').innerHTML='Microsandbox · microVM lab <span class="tag">SDK v0.7.8 · KVM</span>';document.getElementById('intro').textContent='Separate kernels → Execution and isolation → Live Fork → Memory restore after Pod recreation';for(const [id,t]of Object.entries({'phase-label':'Experiment status','passed-label':'Passed checks','failed-label':'Failed checks',suite:'Run suite',restore:'Verify restore',note:'Article SDK lab page, not the official Console. Real microVM records; full and disk-only restore checked separately.'}))document.getElementById(id).textContent=t;document.querySelectorAll('th').forEach((e,i)=>e.textContent=['Actual check','Result','Measurement and evidence'][i])}refresh();setInterval(refresh,2000)
</script></html>
