apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-vllm-bench-inspect
  namespace: aik8s-ms
  labels:
    app.kubernetes.io/name: kimi-k3-vllm-bench-inspect
    app.kubernetes.io/part-of: kimi-k3-h20
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimi-k3-vllm-bench-inspect
        app.kubernetes.io/part-of: kimi-k3-h20
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: 10.91.4.242
      tolerations:
        - key: quarantine-room
          operator: Equal
          value: gpu-training-H20
          effect: NoSchedule
        - key: quarantine-room
          operator: Equal
          value: gpu-training-H20
          effect: NoExecute
      containers:
        - name: inspect
          image: vip-gd-harbor.tencentcloudcr.com/vip/llm-serving-vllm:kimi-k3-cu130-amd64-20260831
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              import inspect
              import vllm.entrypoints.cli.benchmark.serve as cli_serve
              import vllm.benchmarks.serve as bench_serve

              print("=== CLI SERVE ===")
              print(inspect.getsource(cli_serve))
              print("=== RUST REFERENCES ===")
              source = inspect.getsource(bench_serve)
              lines = source.splitlines()
              for index, line in enumerate(lines):
                  if "rust" in line.lower() or "vllm-rs" in line.lower():
                      start = max(0, index - 12)
                      end = min(len(lines), index + 18)
                      print("\n".join(lines[start:end]))
                      print("---")
