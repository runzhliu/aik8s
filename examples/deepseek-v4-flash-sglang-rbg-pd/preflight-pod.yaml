# Optional preflight only. This Pod does not request a GPU and is not included
# by kustomization.yaml. Replace the image before applying it manually.
apiVersion: v1
kind: Pod
metadata:
  name: deepseek-v4-flash-sglang-pd-preflight
  namespace: deepseek-serving
  labels:
    app.kubernetes.io/name: deepseek-v4-flash-sglang-pd-preflight
spec:
  restartPolicy: Never
  nodeSelector:
    label-group: gpu-training-H20-96G
    feature.node.kubernetes.io/custom-rdma.available: "true"
  tolerations:
    - key: quarantine-room
      operator: Equal
      value: gpu-training-H20-96G
  containers:
    - name: verify-runtime
      image: example.invalid/ai/sglang:replace-me
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -ceu
        - |
          sglang_root="$(python - <<'PY'
          import importlib.util

          for module in ("sglang", "nixl"):
              spec = importlib.util.find_spec(module)
              if spec is None:
                  raise SystemExit(f"required Python module is missing: {module}")
              print(f"{module}: {spec.origin or spec.submodule_search_locations}")

          spec = importlib.util.find_spec("sglang")
          print(next(iter(spec.submodule_search_locations)))
          PY
          )"
          echo "${sglang_root}"
          python -c 'import nixl; print("NIXL import: OK")'
          grep -R -m1 -- '--disaggregation-mode' "$(echo "${sglang_root}" | tail -n 1)"
          grep -R -m1 -- '--disaggregation-transfer-backend' "$(echo "${sglang_root}" | tail -n 1)"
          echo "SGLang/NIXL image preflight: PASS"
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 8Gi
