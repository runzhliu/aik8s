              feature.node.kubernetes.io/custom-rdma.available: "true"
            tolerations:
              - key: quarantine-room
                operator: Equal
                value: gpu-training-H20-96G
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: deepseek-v4-flash-sglang-pd
                    topologyKey: kubernetes.io/hostname
            initContainers:
              - name: verify-runtime
                image: example.invalid/ai/sglang:replace-me
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/bash
                  - /runtime/verify-runtime.sh
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
                volumeMounts:
                  - name: runtime
                    mountPath: /runtime
              - name: download-model
                image: example.invalid/ai/model-sync:replace-me
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/bash
                  - /runtime/download-model.sh
                envFrom:
                  - secretRef:
                      name: deepseek-v4-flash-model-source
                env:
                  - name: AWS_EC2_METADATA_DISABLED
                    value: "true"
                resources:
                  requests:
                    cpu: "4"
                    memory: 8Gi
