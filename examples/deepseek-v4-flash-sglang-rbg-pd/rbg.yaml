                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
                securityContext:
                  capabilities:
                    add:
                      - IPC_LOCK
                resources:
                  requests:
                    cpu: "80"
                    memory: 700Gi
                    ephemeral-storage: 180Gi
                    nvidia.com/gpu: "8"
                  limits:
                    cpu: "160"
                    memory: 1200Gi
                    ephemeral-storage: 220Gi
                    nvidia.com/gpu: "8"
                volumeMounts:
                  - name: model
                    mountPath: /workspace/model
                  - name: runtime
                    mountPath: /runtime
                  - name: dshm
                    mountPath: /dev/shm
            volumes:
              - name: model
                emptyDir: {}
              - name: runtime
                configMap:
                  name: deepseek-v4-flash-sglang-pd-runtime
                  defaultMode: 493
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 64Gi
