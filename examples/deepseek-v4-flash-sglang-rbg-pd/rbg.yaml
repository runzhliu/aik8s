            containers:
              - name: decode
                image: example.invalid/ai/sglang:replace-me
                imagePullPolicy: IfNotPresent
                command:
                  - /bin/bash
                  - /runtime/start-decode.sh
                env:
                  - name: GLOO_SOCKET_IFNAME
                    value: eth0
                  - name: NCCL_SOCKET_IFNAME
