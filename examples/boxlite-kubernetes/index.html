<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BoxLite SDK Lab</title>
<style>body{margin:0;background:#f5f7fc;color:#25324a;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:24px auto}h1{font-size:27px;margin:0}p{color:#66758c;margin:6px 0 18px}.tag{font-size:13px;background:#e8edff;color:#435ccf;padding:6px 12px;border-radius:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card,section{background:#fff;border:1px solid #dce3f0;border-radius:12px;padding:18px}.value{font-size:30px;color:#3e5bdd}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e7ebf3;padding:10px 8px}th{font-size:14px;color:#6a7890}.passed{color:#16816c}.failed{color:#ca404d}button{background:#435de0;color:#fff;border:0;border-radius:7px;padding:10px 18px;cursor:pointer}small{color:#74829a}code{font-size:13px}main{margin:16px auto}.stats{margin:14px 0}.card,section{padding:14px}th,td{padding:7px 8px}.value{font-size:28px}</style>
<main><a style="float:right;font-size:13px" href="#en" onclick="location.hash=location.hash==='#en'?'':'en';location.reload();return false">中文 / English</a><h1>BoxLite · microVM 实验记录 <span class="tag">SDK v0.10.7</span></h1><p>创建独立 guest → 执行 Python → 验证隔离与恢复 → 回收资源</p>
<div class="stats"><div class="card">实验状态<div class="value" id="phase">—</div></div><div class="card">通过检查<div class="value" id="passed">—</div></div><div class="card">失败检查<div class="value" id="failed">—</div></div></div>
<section><table><thead><tr><th>实际验证项</th><th>结果</th><th>测量与输出</th></tr></thead><tbody id="rows"></tbody></table></section><p><small>本文配套 SDK 实验页，非官方 Console。数据来自真实 microVM 操作记录；磁盘恢复不代表内存快照。</small></p></main>
<script>const labels={cached_start:'缓存镜像后的启动 · 10 次',warm_exec:'已启动环境执行 Python · 20 次',file_isolation:'独立内核 / 文件隔离 / 文件回传',timeout:'2 秒执行期限',parallel_cpu_repeat:'4 个 microVM 资源复测',parallel_cpu:'4 个 microVM 并发 CPU 任务',persistence_prepare:'停止实例，准备重建 Pod',persistence_verify:'Pod 重建后恢复磁盘'};const fmt=x=>(1000*x).toFixed(1)+' ms';function detail(r){if(r.status!=='passed')return '查看原始记录';if(r.test==='cached_start'){let a=r.samples.map(x=>x.start_seconds).sort((a,b)=>a-b);return 'P50 '+fmt((a[4]+a[5])/2)+' · min '+fmt(a[0])+' · max '+fmt(a[9])};if(r.test==='warm_exec'){let a=[...r.samples_seconds].sort((a,b)=>a-b);return 'P50 '+fmt((a[9]+a[10])/2)+' · '+a.length+' / '+a.length}if(r.test==='file_isolation')return '不同 boot_id · 文件互不可见 · SHA-256 一致';if(r.test==='timeout')return fmt(r.elapsed_seconds)+' · exit '+r.exit_code+' · 环境仍可执行';if(['parallel_cpu','parallel_cpu_repeat'].includes(r.test))return r.concurrency+' × 1 vCPU / 512 MiB · '+r.elapsed_seconds.toFixed(2)+' s';if(r.test==='persistence_prepare')return '磁盘保留 · 实例停止';if(r.test==='persistence_verify')return '同一 Box ID · 文件保留 · guest 已重新启动';return ''}async function refresh(){let s=await(await fetch('/api/state')).json();document.getElementById('phase').textContent=s.busy?'运行中':'就绪';for(let k of ['passed','failed'])document.getElementById(k).textContent=s.records.filter(r=>r.status===k).length;let rows=document.getElementById('rows');rows.replaceChildren();for(let r of s.records){let tr=document.createElement('tr');for(let text of [labels[r.test]||r.test,r.status.toUpperCase(),detail(r)]){let td=document.createElement('td');td.textContent=text;tr.appendChild(td)}tr.children[1].className=r.status;rows.appendChild(tr)}}refresh();setInterval(refresh,2000)</script><script>
if(location.hash==='#en'){
 document.documentElement.lang='en';
 document.querySelector('h1').innerHTML='BoxLite · microVM lab records <span class="tag">SDK v0.10.7</span>';
 document.querySelector('main>p').textContent='Create guests → Execute Python → Validate separation and recovery → Reclaim resources';
 const headings=['Experiment status','Passed checks','Failed checks'];
 document.querySelectorAll('.card').forEach((el,i)=>el.firstChild.textContent=headings[i]);
 document.querySelectorAll('th').forEach((el,i)=>el.textContent=['Actual check','Result','Measurement and output'][i]);
 document.querySelector('small').textContent='Article SDK lab page, not the official Console. Real microVM records; disk recovery is not a memory checkpoint.';
 Object.assign(labels,{cached_start:'Cached-image start · 10 samples',warm_exec:'Python in running Box · 20 samples',file_isolation:'Separate kernels / files / transfer',timeout:'2-second execution deadline',parallel_cpu:'Four concurrent CPU tasks',persistence_prepare:'Stop Box before Pod recreation',persistence_verify:'Recover disk after Pod recreation',parallel_cpu_repeat:'Four-box resource repeat'});
 const original=detail;detail=r=>original(r).replaceAll('不同 boot_id · 文件互不可见 · SHA-256 一致','Different boot IDs · separate files · matching SHA-256').replaceAll('环境仍可执行','Box remains usable').replaceAll('磁盘保留 · 实例停止','Disk retained · Box stopped').replaceAll('同一 Box ID · 文件保留 · guest 已重新启动','Same Box ID · file retained · guest rebooted').replaceAll('查看原始记录','Inspect raw record');
 const observer=new MutationObserver(()=>{let e=document.getElementById('phase');if(e.textContent==='就绪')e.textContent='Ready';if(e.textContent==='运行中')e.textContent='Running'});observer.observe(document.getElementById('phase'),{childList:true});
}
</script></html>
