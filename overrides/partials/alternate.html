<div class="md-header__option aik8s-view-toggle">
  <a href="{{ 'timeline.html' | url }}" class="md-header__button md-icon"
     data-aik8s-timeline aria-label="{{ 'Browse article timeline' if config.theme.language == 'en' else '按时间线浏览文章' }}"
     title="{{ 'Article timeline' if config.theme.language == 'en' else '文章时间线' }}">
    {% include ".icons/material/history.svg" %}
    <span class="aik8s-view-toggle__label">{{ 'Timeline' if config.theme.language == 'en' else '时间线' }}</span>
  </a>
</div>
<div class="md-header__option">
  <div class="md-select">
    <button class="md-header__button md-icon" aria-label="{{ lang.t('select.language') }}">
      {% include ".icons/material/translate.svg" %}
    </button>
    <div class="md-select__inner">
      <ul class="md-select__list">
        {% for alt in config.extra.alternate %}
          <li class="md-select__item">
            <a href="{{ alt.link }}{{ page.url if page and page.url else '' }}"
               hreflang="{{ alt.lang }}" lang="{{ alt.lang }}" class="md-select__link"
               {% if alt.lang == config.theme.language %}aria-current="true"{% endif %}>
              {{ alt.name }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
