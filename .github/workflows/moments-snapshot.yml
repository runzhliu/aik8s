name: Update moments snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: write
  issues: read

concurrency:
  group: moments-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.issue.labels.*.name, 'moments') || github.event.label.name == 'moments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check out public snapshot branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: moments-data
          path: .local/moments-snapshot
      - name: Generate public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_moments_snapshot.py --output .local/moments-snapshot/moments-issues.json
      - name: Update snapshot branch
        working-directory: .local/moments-snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moments-issues.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public moments snapshot'
          git push origin HEAD:moments-data
