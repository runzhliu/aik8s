name: Scheduled external link report

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build the bilingual site
        run: |
          python -m pip install --requirement requirements.txt
          python scripts/build_bilingual.py
      - name: Report external link health without blocking publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_site_links.py --site-dir site --site-url https://aik8s.run/ \
            --external --external-limit 0 --external-workers 4 \
            --external-host-interval 1 --external-timeout 8 | tee external-link-report.md
          cat external-link-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-link-report
          path: external-link-report.md
          if-no-files-found: ignore
          retention-days: 14
